<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>工程细胞主题库 · 前台工作台原型</title>
  <style>
    :root {
      --navy: #12396f;
      --navy-deep: #0b2852;
      --blue: #1d63d8;
      --blue-soft: #e8f1ff;
      --ink: #17243a;
      --muted: #6b7890;
      --line: #e3e9f2;
      --panel: #ffffff;
      --canvas: #f3f6fa;
      --green: #1d9b70;
      --green-soft: #e8f7f1;
      --orange: #c77918;
      --orange-soft: #fff4e3;
      --red: #c84d57;
      --red-soft: #fff0f1;
      --shadow: 0 12px 28px rgba(20, 45, 82, .08);
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: Inter, "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: var(--ink);
      background: var(--canvas);
      font-size: 14px;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .icon { width: 18px; height: 18px; flex: 0 0 auto; }
    .app-shell { width: 100%; height: 100vh; min-height: 0; display: flex; overflow: hidden; }

    .sidebar {
      width: 256px;
      height: 100vh;
      min-height: 0;
      flex: 0 0 256px;
      background: #fff;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      transition: transform .2s ease;
      z-index: 20;
    }
    .brand {
      min-height: 78px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--line);
    }
    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--navy);
      color: #fff;
      display: grid;
      place-items: center;
      flex: 0 0 38px;
    }
    .brand h1 { margin: 0; font-size: 15px; line-height: 1.35; font-weight: 700; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .side-context {
      margin: 18px 16px 10px;
      padding: 11px 12px;
      border: 1px solid #dce7f6;
      border-radius: var(--radius);
      background: #f6f9fe;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .side-context span:first-child { color: var(--muted); font-size: 12px; }
    .context-value { color: var(--navy); font-weight: 700; white-space: nowrap; }
    .side-label {
      padding: 13px 20px 8px;
      color: #9aa6b8;
      font-size: 11px;
      letter-spacing: .08em;
    }
    .side-nav { flex: 1 1 auto; min-height: 0; padding: 0 10px; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
    .nav-item {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      color: #46546b;
      border-radius: 7px;
      padding: 11px 12px;
      margin: 2px 0;
      display: flex;
      align-items: center;
      gap: 11px;
      position: relative;
      transition: background .15s, color .15s;
      min-height: 48px;
    }
    .nav-item:hover { background: #f3f7fc; color: var(--navy); }
    .nav-item.active {
      color: var(--blue);
      background: var(--blue-soft);
      font-weight: 700;
    }
    .nav-item.active::before {
      content: "";
      width: 3px;
      height: 22px;
      position: absolute;
      left: 0;
      border-radius: 0 3px 3px 0;
      background: var(--blue);
    }
    .nav-tree-group { margin: 2px 0; }
    .nav-parent { justify-content: flex-start; }
    .nav-parent.parent-current { color: var(--navy); background: #f7fafe; font-weight: 700; }
    .nav-parent .nav-chevron {
      margin-left: auto;
      width: 15px;
      height: 15px;
      display: grid;
      place-items: center;
      color: #91a0b4;
      transition: transform .18s ease;
    }
    .nav-parent .nav-chevron.expanded { transform: rotate(90deg); }
    .nav-parent .nav-chevron .icon { width: 14px; height: 14px; }
    .nav-children {
      display: none;
      margin: 0 0 3px 19px;
      padding-left: 8px;
      border-left: 1px solid #e5ecf5;
    }
    .nav-children.open { display: block; }
    .nav-item.level-1 { padding-left: 12px; }
    .nav-item.level-2 { padding-left: 13px; }
    .nav-item.level-1 .nav-icon,
    .nav-item.level-2 .nav-icon { width: 16px; height: 16px; }
    .nav-item.level-1 .nav-copy strong,
    .nav-item.level-2 .nav-copy strong { font-size: 12px; font-weight: inherit; }
    .nav-item .nav-copy { min-width: 0; flex: 1 1 auto; }
    .nav-item .nav-copy strong { display: block; white-space: normal; overflow-wrap: anywhere; line-height: 1.45; }
    .nav-item.level-2 { color: #5d6b80; }
    .nav-item.level-2.active { color: var(--blue); background: #eef5ff; }
    .nav-item.level-3 { color: #728096; padding-top: 8px; padding-bottom: 8px; min-height: 38px; }
    .nav-item.level-3 .nav-icon { width: 14px; height: 14px; }
    .nav-item.level-3 .nav-copy strong { font-size: 11px; font-weight: inherit; }
    .nav-item.level-3.active { color: var(--blue); background: #f1f6fd; }
    .nav-icon { width: 19px; height: 19px; flex: 0 0 19px; }
    .nav-copy { min-width: 0; flex: 1; display: block; overflow: hidden; }
    .nav-copy strong { display: block; font-size: 13px; font-weight: inherit; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .main-column { min-width: 0; min-height: 0; height: 100vh; flex: 1 1 auto; display: flex; flex-direction: column; overflow: hidden; }
    .topbar {
      height: 78px;
      padding: 0 30px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 22px;
      flex: 0 0 78px;
      z-index: 10;
    }
    .mobile-menu {
      display: none;
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--navy);
      border-radius: 6px;
      place-items: center;
    }
    .breadcrumbs { display: flex; align-items: center; gap: 8px; min-width: 220px; }
    .breadcrumbs span { color: #9aa6b8; }
    .breadcrumbs strong { color: var(--ink); font-weight: 700; }
    /* ===== 前后台切换入口（前台 app.html ⇄ 后台 admin.html） ===== */
    .portal-switch {
      margin-left: auto;
      display: inline-flex;
      gap: 2px;
      padding: 3px;
      background: #f1f4f8;
      border-radius: 7px;
    }
    .portal-btn {
      min-width: 96px;
      height: 32px;
      padding: 0 13px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      line-height: 1;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, color .15s;
    }
    .portal-btn:hover { color: var(--navy); background: #e7edf6; }
    .portal-btn.active {
      background: #fff;
      color: var(--navy);
      font-weight: 700;
      box-shadow: 0 1px 3px rgba(20, 45, 82, .12);
    }
    .portal-btn.portal-logout {
      min-width: 76px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
    }
    .portal-btn.portal-logout:hover {
      color: #c84d57;
      border-color: #e8ccd0;
      background: #fff6f7;
    }
    @media (max-width: 900px) {
      .portal-switch { margin-left: 8px; }
      .portal-btn { min-width: 62px; padding: 0 8px; font-size: 12px; }
    }

    .top-action {
      width: 35px;
      height: 35px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: #68758a;
      display: grid;
      place-items: center;
      position: relative;
    }
    .top-action .badge {
      position: absolute;
      right: -3px;
      top: -3px;
      width: 7px;
      height: 7px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: var(--red);
    }
    .user-box { display: flex; align-items: center; gap: 9px; padding-left: 4px; }
    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--blue-soft);
      color: var(--blue);
      display: grid;
      place-items: center;
      font-weight: 700;
    }
    .user-box strong { display: block; font-size: 13px; }
    .user-box small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }

    .content {
      flex: 1 1 auto;
      min-height: 0;
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 28px 30px 42px;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }
    .page-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
    }
    .page-heading h2 { margin: 0; font-size: 25px; letter-spacing: 0; }
    .page-heading p { margin: 8px 0 0; color: var(--muted); line-height: 1.6; }
    .heading-actions { display: flex; gap: 9px; flex-wrap: wrap; justify-content: flex-end; }
    .ingestion-page-heading .page-actions .btn { min-width: 88px; }
    .btn {
      min-height: 36px;
      padding: 0 14px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #fff;
      color: #4d5c72;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    .btn:hover { border-color: #b9c9df; color: var(--navy); }
    .btn.primary { border-color: var(--blue); background: var(--blue); color: #fff; }
    .btn.primary:hover { background: #1755bd; }
    .btn .icon { width: 16px; height: 16px; }

    .overview-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 17px 18px;
      box-shadow: 0 3px 10px rgba(20,45,82,.025);
    }
    .metric-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-icon {
      width: 31px;
      height: 31px;
      border-radius: 7px;
      display: grid;
      place-items: center;
    }
    .metric-icon.blue { color: var(--blue); background: var(--blue-soft); }
    .metric-icon.green { color: var(--green); background: var(--green-soft); }
    .metric-icon.orange { color: var(--orange); background: var(--orange-soft); }
    .metric-icon.red { color: var(--red); background: var(--red-soft); }
    .metric-value { margin-top: 13px; font-size: 26px; line-height: 1; font-weight: 750; }
    .metric-foot { margin-top: 10px; color: var(--muted); font-size: 11px; }
    .metric-foot em { color: var(--green); font-style: normal; font-weight: 700; }

    .section-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(340px, .85fr); gap: 16px; margin-top: 18px; }
    .panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 3px 10px rgba(20,45,82,.025);
    }
    .panel-head {
      padding: 17px 19px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .panel-head h3 { margin: 0; font-size: 15px; }
    .panel-head p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .panel-link { border: 0; background: transparent; color: var(--blue); font-size: 12px; padding: 4px 0; }
    .panel-body { padding: 17px 19px; }
    .activity-row {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) auto;
      align-items: center;
      gap: 11px;
      padding: 12px 0;
      border-bottom: 1px solid #eef2f7;
    }
    .activity-row:first-child { padding-top: 0; }
    .activity-row:last-child { padding-bottom: 0; border-bottom: 0; }
    .activity-icon {
      width: 30px; height: 30px; border-radius: 7px;
      display: grid; place-items: center; color: var(--blue); background: var(--blue-soft);
    }
    .activity-row strong { display: block; font-size: 13px; }
    .activity-row small { display: block; color: var(--muted); margin-top: 4px; font-size: 11px; }
    .activity-state { font-size: 11px; padding: 4px 8px; border-radius: 12px; white-space: nowrap; }
    .state-success { color: var(--green); background: var(--green-soft); }
    .state-progress { color: var(--blue); background: var(--blue-soft); }
    .state-warning { color: var(--orange); background: var(--orange-soft); }
    .state-danger { color: var(--red); background: var(--red-soft); }

    .module-list { display: grid; gap: 10px; }
    .module-card {
      border: 1px solid #e6edf5;
      border-radius: 7px;
      padding: 13px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color .15s, background .15s;
    }
    .module-card:hover { border-color: #c2d4ec; background: #fbfdff; }
    .module-card .module-icon {
      width: 34px; height: 34px; border-radius: 7px;
      display: grid; place-items: center; color: var(--navy); background: #edf3fb;
      flex: 0 0 34px;
    }
    .module-card main { min-width: 0; flex: 1; }
    .module-card strong { display: block; font-size: 13px; }
    .module-card small { display: block; color: var(--muted); margin-top: 4px; font-size: 11px; }
    .module-count { color: var(--navy); font-weight: 700; font-size: 15px; }

    .process-band { margin-top: 18px; padding: 19px; }
    .process-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .process-head h3 { margin: 0; font-size: 15px; }
    .process-head span { color: var(--muted); font-size: 11px; }
    .process-track { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; margin-top: 23px; }
    .process-step { position: relative; padding-right: 18px; }
    .process-step:not(:last-child)::after {
      content: "";
      position: absolute;
      left: 30px;
      right: 11px;
      top: 13px;
      height: 1px;
      background: #dbe5f2;
    }
    .process-node {
      width: 27px;
      height: 27px;
      position: relative;
      z-index: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #e9eef5;
      color: #718097;
      border: 4px solid #fff;
      box-shadow: 0 0 0 1px #dbe5f2;
    }
    .process-step.done .process-node { color: #fff; background: var(--green); box-shadow: 0 0 0 1px var(--green); }
    .process-step.current .process-node { color: #fff; background: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
    .process-step strong { display: block; margin-top: 10px; font-size: 12px; }
    .process-step small { display: block; color: var(--muted); margin-top: 4px; font-size: 11px; }
    .search-box {
      min-width: 280px;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 6px;
      padding: 0 11px;
      height: 38px;
    }
    .search-box input { width: 100%; border: 0; outline: 0; color: var(--ink); }
    .search-box input::placeholder { color: #a5b0bf; }
    .filter-select {
      height: 38px;
      padding: 0 32px 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background-color: #fff;
      background-image: linear-gradient(45deg, transparent 50%, #8090a4 50%), linear-gradient(135deg, #8090a4 50%, transparent 50%);
      background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%;
      background-repeat: no-repeat;
      background-size: 5px 5px;
      color: #526178;
      font: inherit;
      cursor: pointer;
      outline: 0;
      transition: border-color .16s ease, box-shadow .16s ease, background-color .16s ease;
      appearance: none;
    }
    .filter-select:hover { border-color: #aac5e7; background-color: #fbfdff; }
    .filter-select:focus { border-color: #8fb7e9; box-shadow: 0 0 0 3px rgba(38, 111, 213, .1); }
    .table-wrap { overflow: auto; }
    /* Lists keep the operation column available while business columns scroll horizontally. */
    .table-wrap.has-sticky-actions,
    .approval-table-wrap.has-sticky-actions { position: relative; }
    .table-wrap.has-sticky-actions table,
    .approval-table-wrap.has-sticky-actions table { min-width: 100%; }
    .table-wrap.has-sticky-actions thead th:last-child,
    .table-wrap.has-sticky-actions tbody td:last-child,
    .approval-table-wrap.has-sticky-actions thead th:last-child,
    .approval-table-wrap.has-sticky-actions tbody td:last-child {
      position: sticky;
      right: 0;
      z-index: 2;
      background: #fff;
      box-shadow: -8px 0 14px rgba(37, 67, 104, 0.08);
    }
    .table-wrap.has-sticky-actions thead th:last-child,
    .approval-table-wrap.has-sticky-actions thead th:last-child {
      z-index: 4;
      background: #f7f9fc;
    }
    .table-wrap.has-sticky-actions tbody td:last-child,
    .approval-table-wrap.has-sticky-actions tbody td:last-child {
      min-width: 132px;
      white-space: nowrap;
    }
    @media (max-width: 760px) {}
    @media (max-width: 1100px) {}
    @media (max-width: 650px) {}
    @media (max-width: 820px) {}
    @media (max-width: 900px) {}
    @media (max-width: 760px) {}
    .dataset-library-pagination { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; color: var(--muted); font-size: 12px; }
    .dataset-library-pagination .pagination-actions { display: flex; align-items: center; gap: 6px; }
    .dataset-library-pagination .page-button { min-width: 30px; height: 30px; border: 1px solid var(--line); background: #fff; border-radius: 5px; color: var(--muted); }
    .dataset-library-pagination .page-button.active { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); font-weight: 700; }
    .dataset-library-drawer { width: min(1040px, calc(100vw - 24px)); height: calc(100vh - 16px); max-height: calc(100vh - 16px); margin: 8px 8px 8px auto; border-radius: 8px 0 0 8px; }
    .dataset-library-drawer .phenotype-drawer-body { padding: 0 30px 30px; }
    .dataset-library-drawer .dataset-drawer-section { padding: 24px 0; }
    .dataset-library-drawer .dataset-drawer-section:first-child { padding-top: 22px; }
    .dataset-library-drawer .dataset-drawer-section h4 { font-size: 15px; }
    .dataset-library-drawer .dataset-detail-grid { grid-template-columns: 132px minmax(0, 1fr) 132px minmax(0, 1fr); gap: 14px 18px; }
    .dataset-library-drawer .dataset-detail-grid dt { padding-top: 1px; }
    .dataset-library-drawer .dataset-detail-grid dd { min-width: 0; }
    .dataset-detail-section-heading .tag { flex: 0 0 auto; }
    .dataset-basic-section + .dataset-drawer-section { margin-top: 20px; }
    .dataset-library-drawer .table-wrap { overflow-x: auto; border: 1px solid #e5edf5; border-radius: 7px; }
    .dataset-library-drawer table { min-width: 760px; }
    .dataset-library-drawer .multiomics-collection-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .dataset-detail-grid { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px 18px; margin: 0; font-size: 13px; }
    .dataset-detail-grid dt { color: var(--muted); }
    .dataset-detail-grid dd { margin: 0; line-height: 1.55; overflow-wrap: anywhere; }
    .dataset-drawer-section { padding: 20px 0; border-bottom: 1px solid var(--line); }
    .dataset-drawer-section:first-child { padding-top: 0; }
    .dataset-drawer-section:last-child { border-bottom: 0; }
    .dataset-drawer-section h4 { margin-bottom: 15px; }
    @media (max-width: 760px) {}
    @media (max-width: 700px) {}
    @media (max-width: 760px) {
      .dataset-library-pagination { align-items: flex-start; flex-direction: column; }
      .dataset-library-drawer .dataset-detail-grid { grid-template-columns: 112px minmax(0, 1fr); }
      .dataset-library-drawer .multiomics-collection-grid { grid-template-columns: 1fr; }
    }
    /* ===== 数据查询 · 查看详情：与「数据入库」查看详情同源的分组表格式 ===== */
    .status { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; }
    .status-草稿 { background: #eef2f7; color: #64748b; }
    .status-待审核 { background: #e0edff; color: #2563eb; }
    .status-已发布 { background: #dcfce7; color: #16a34a; }
    .status-已归档 { background: #ffedd5; color: #ea580c; }
    .ingestion-detail-drawer { width: min(1000px, calc(100vw - 24px)); }
    .ingestion-detail-drawer .phenotype-drawer-body { padding: 16px 26px 28px; }
    .ingestion-detail-drawer header h3 .src-sub { margin-left: 8px; }
    .fgroup { margin-bottom: 14px; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; }
    .fgroup:last-child { margin-bottom: 0; }

      const portal = PORTALS.front;

        const hasChildren = Array.isArray(item.children) && item.children.length > 0;

        const expanded = state.expanded[item.key] === true || isParentCurrent;
        const buttonClass = [

          level === 0 ? "nav-parent" : `level-${level}`,

          isParentCurrent ? "parent-current" : ""

        .map(([x, y, r], i) => `<g transform="translate(${x} ${y}) rotate(${r})"><rect x="-36" y="-13" width="72" height="26" rx="13" fill="${p.cell}" opacity="${(0.92 - i * 0.07).toFixed(2)}"/><path d="M-19 0c6-8 19-8 25 0s-7 9-13 9-14-1-12-9Z" fill="${p.inner}" opacity=".5"/><circle cx="14" cy="-4" r="3" fill="${p.glow}" opacity=".7"/></g>`).join("");
    }

    function artOval(p) {
      const buds = [[64, 54, 20], [252, 62, 15], [92, 152, 13]]
        .map(([cx, cy, r], i) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${p.cell}" opacity="${(0.55 - i * 0.08).toFixed(2)}"/>`).join("");
      return `${buds}<g transform="translate(158 104)"><ellipse rx="54" ry="47" fill="${p.cell}"/><circle cx="60" cy="-30" r="23" fill="${p.cell}" opacity=".86"/><ellipse cx="-8" cy="6" rx="23" ry="19" fill="${p.inner}" opacity=".32"/><circle cx="-26" cy="-18" r="6.5" fill="${p.glow}" opacity=".8"/><circle cx="30" cy="16" r="8" fill="${p.inner}" opacity=".22"/></g>`;
    }

    function artChain(p) {
      return `<g>${[[52, 132, 21], [96, 116, 22], [142, 108, 21], [188, 108, 22], [232, 116, 21], [272, 134, 20]]
        .map(([cx, cy, r], i) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${p.cell}" opacity="${(0.94 - i * 0.05).toFixed(2)}"/><circle cx="${cx - r * 0.3}" cy="${cy - r * 0.3}" r="${(r * 0.22).toFixed(1)}" fill="${p.glow}" opacity=".6"/>`).join("")}</g><g opacity=".4"><circle cx="70" cy="72" r="14" fill="${p.cell}"/><circle cx="248" cy="66" r="12" fill="${p.cell}"/></g>`;
    }

    function artFilament(p) {
      return `<g fill="none" stroke="${p.cell}" stroke-width="5.5" stroke-linecap="round" opacity=".9"><path d="M22 150c34-18 46-52 76-58s42 24 74 16 34-40 70-46"/><path d="M96 92c8-30 34-42 62-44"/><path d="M170 116c14 22 40 30 68 26"/><path d="M240 62c6 26 22 40 46 46"/></g><g fill="${p.cell}">${[[22, 150, 9], [98, 90, 8], [172, 108, 8], [242, 62, 9], [286, 108, 8], [158, 48, 7], [238, 142, 8], [70, 100, 7]]
        .map(([cx, cy, r], i) => `<circle cx="${cx}" cy="${cy}" r="${r}" opacity="${(0.9 - i * 0.05).toFixed(2)}"/>`).join("")}</g><g fill="${p.inner}" opacity=".35">${[[40, 132, 3], [120, 104, 3], [200, 128, 3], [262, 82, 3]].map(([cx, cy, r]) => `<circle cx="${cx}" cy="${cy}" r="${r}"/>`).join("")}</g>`;
    }

    function artAdherent(p) {
      return `<g transform="translate(158 100)"><path d="M-84 6c-18-22 2-52 30-56 12-26 54-34 76-14 26-16 62 4 60 34 14 22-4 50-30 52-14 20-52 24-70 8-24 10-54-2-66-24Z" fill="${p.cell}" opacity=".9"/><ellipse rx="30" ry="22" fill="${p.inner}" opacity=".38"/><circle cx="8" cy="-2" r="7" fill="${p.inner}" opacity=".5"/><path d="M-84 6c-16 6-30 4-38-4M86 26c14 10 28 14 40 12" fill="none" stroke="${p.cell}" stroke-width="5" stroke-linecap="round" opacity=".7"/></g><g opacity=".45"><ellipse cx="60" cy="52" rx="20" ry="14" fill="${p.cell}" transform="rotate(-20 60 52)"/><ellipse cx="262" cy="150" rx="17" ry="12" fill="${p.cell}" transform="rotate(16 262 150)"/></g>`;
    }

    function artCluster(p) {
      return `<g>${[[92, 84, 30], [158, 112, 34], [226, 82, 28], [120, 152, 24], [206, 148, 22]]
        .map(([cx, cy, r], i) => `<g><circle cx="${cx}" cy="${cy}" r="${r}" fill="${p.cell}" opacity="${(0.9 - i * 0.06).toFixed(2)}"/><circle cx="${cx}" cy="${cy}" r="${(r * 0.62).toFixed(1)}" fill="${p.inner}" opacity=".22"/><circle cx="${(cx - r * 0.3).toFixed(1)}" cy="${(cy - r * 0.34).toFixed(1)}" r="${(r * 0.16).toFixed(1)}" fill="${p.glow}" opacity=".7"/></g>`).join("")}</g>`;
    }

    const SERVICE_CELL_ART_DRAWINGS = { rod: artRod, oval: artOval, chain: artChain, filament: artFilament, adherent: artAdherent, cluster: artCluster };

    /* 按菌株编号做确定性的色相偏移与构图旋转，使同形态菌株的示意图彼此可区分 */
    function artSeed(text) {
      return String(text || "").split("").reduce((sum, char) => sum + char.charCodeAt(0), 0);
    }

    function artShiftColor(hex, deg) {
      const value = String(hex).replace("#", "");
      const r = parseInt(value.slice(0, 2), 16) / 255;
      const g = parseInt(value.slice(2, 4), 16) / 255;
      const b = parseInt(value.slice(4, 6), 16) / 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b), lightness = (max + min) / 2;
      const delta = max - min;
      const saturation = delta === 0 ? 0 : delta / (1 - Math.abs(2 * lightness - 1));
      let hue = 0;
      if (delta !== 0) {
        if (max === r) hue = ((g - b) / delta) % 6;
        else if (max === g) hue = (b - r) / delta + 2;
        else hue = (r - g) / delta + 4;
        hue *= 60;
        if (hue < 0) hue += 360;
      }
      const shifted = (hue + deg + 360) % 360;
      const chroma = (1 - Math.abs(2 * lightness - 1)) * saturation;
      const second = chroma * (1 - Math.abs(((shifted / 60) % 2) - 1));
      const offset = lightness - chroma / 2;
      const rgb = shifted < 60 ? [chroma, second, 0]
        : shifted < 120 ? [second, chroma, 0]
        : shifted < 180 ? [0, chroma, second]
        : shifted < 240 ? [0, second, chroma]
        : shifted < 300 ? [second, 0, chroma]
        : [chroma, 0, second];
      return "#" + rgb.map(channel => Math.round((channel + offset) * 255).toString(16).padStart(2, "0")).join("");
    }

    function serviceCellArtPalette(item) {
      const base = SERVICE_CELL_ART_PALETTES[serviceCellArtStyle(item)];
      const shift = (artSeed(item.id) % 7) * 10 - 30;
      return { sky: artShiftColor(base.sky, shift), deep: artShiftColor(base.deep, shift), cell: artShiftColor(base.cell, shift), inner: artShiftColor(base.inner, shift), glow: base.glow };
    }

    function serviceCellArtwork(item) {
      const palette = serviceCellArtPalette(item);
      const rotation = (artSeed(item.id) % 5) * 3 - 6;
      const drawing = `<g transform="rotate(${rotation} 160 100)">${(SERVICE_CELL_ART_DRAWINGS[serviceCellMorphology(item)] || artOval)(palette)}</g>`;
      const uid = "ec" + String(item.id || "cell").replace(/[^A-Za-z0-9]/g, "");
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">`
        + `<defs><linearGradient id="${uid}bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${palette.sky}"/><stop offset="1" stop-color="#ffffff"/></linearGradient>`
        + `<radialGradient id="${uid}glow" cx="0.5" cy="0.44" r="0.62"><stop offset="0" stop-color="#ffffff" stop-opacity="0.86"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient></defs>`
        + `<rect width="320" height="200" fill="url(#${uid}bg)"/>`
        + `<g stroke="${palette.deep}" stroke-width="1" opacity=".45">${ART_FIELD_GRID}</g>`
        + `<ellipse cx="160" cy="100" rx="152" ry="94" fill="url(#${uid}glow)"/>`
        + artParticles(palette) + drawing + artPlasmid(palette) + `</svg>`;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }

    /* 卡片标签：取值来源于「应用方向」，每个卡片最多展示 3 个 */
    function serviceCellCardTags(item) {
      const directions = (item?.applications || []).map(app => app.direction).filter(Boolean);
      const list = [...new Set([...directions, item?.field].filter(Boolean))];
      return list.slice(0, 3);
    }

    /* 关联数据集统计：查看详情列展示关联的数据集个数与数据条数 */
    function serviceDatasetRecords(size) {
      const tail = String(size || "").split("/").pop() || "";
      const match = tail.match(/([\d,]+(?:\.\d+)?)\s*(万)?/);
      if (!match) return 0;
      const value = parseFloat(String(match[1]).replace(/,/g, ""));
      if (!isFinite(value)) return 0;
      return Math.round(value * (match[2] ? 10000 : 1));
    }

    function serviceDatasetCountText(count) {
      if (!count) return "0 条";
      if (count >= 10000) return `${(count / 10000).toFixed(1).replace(/\.0$/, "")} 万条`;
      return `${count.toLocaleString("en-US")} 条`;
    }

    function serviceCellDatasetStat(item) {
      const rows = item?.datasetSelection || [];
      const records = rows.reduce((sum, row) => sum + serviceDatasetRecords(row.size), 0);
      if (rows.length) {
        const types = [...new Set(rows.map(row => row.type).filter(Boolean))];
        return { count: rows.length, records, text: `关联数据集 ${rows.length} 个 · ${serviceDatasetCountText(records)}`, title: rows.map(row => `${row.type || "数据集"}：${row.name || row.id}（${row.size || "规模待补充"}）`).join("\n") + (types.length > 1 ? `\n数据模块：${types.join(" / ")}` : "") };
      }
      /* 未登记关联数据集时，按该菌株的组学关联条目统计，保证卡片统计口径不为空 */
      const omicsRows = item?.omics || [];
      const records2 = omicsRows.reduce((sum, row) => sum + serviceDatasetRecords(row[1]), 0);
      return { count: omicsRows.length, records: records2, text: omicsRows.length ? `关联数据集 ${omicsRows.length} 个 · ${serviceDatasetCountText(records2)}` : "暂无关联数据集", title: omicsRows.map(row => `${row[0]}：${row[1]}`).join("\n") || "该菌株暂未关联数据集" };
    }

    /* 卡片与详情页共用的特性简介：后台「细胞简介」优先，未填写时按细胞特性自动生成 */
    function serviceCellIntro(item) {
      const custom = String(item?.cellIntro || "").replace(/<[^>]*>/g, "").replace(/&nbsp;/g, " ").trim();
      if (custom) return custom;
      const metric = (SERVICE_FUNC_PROFILES[item.id]?.metabolic || [])[0];
      const lead = `以${item.species || item.latin || "工程底盘"}为底盘，经${serviceCellSourceText(item)}获得，主要面向${item.field || "工程化应用"}场景实现${item.fn || "目标功能"}。`;
      const facts = [`生长速度 ${item.speed || "待补充"}`, `倍增时间 ${item.doubling || "待补充"}`, `优化后${item.result || "效果待补充"}`];
      if (metric) facts.push(`关键代谢指标 ${metric[0]} ${metric[1]}`);
      return lead + facts.join("，") + "。";
    }

    function serviceCellMediaMarkup(item, size = "card") {
      /* 后台上传的细胞图片优先，未上传时使用内联生成的细胞示意图 */
      const media = item?.cellImage
        ? `<img src="${item.cellImage}" alt="${escapeHtml(item.name)}细胞图片" loading="lazy">`
        : `<img src="${serviceCellArtwork(item)}" alt="${escapeHtml(item.name)}（${escapeHtml(item.latin || serviceCellTypeText(item) || "工程细胞")}）细胞示意图" loading="lazy">`;
      return `<span class="service-cell-media">${media}<span class="service-cell-badge">${escapeHtml(serviceCellTypeText(item))}</span></span>`;
    }

    /* 工程细胞特性卡片：图片 + 菌株名称 + 标签（最多 3 个，来源于应用方向）+ 简介 + 关联数据集统计 */
    function serviceCellCardMarkup(item) {
      const tags = serviceCellCardTags(item);
      const stat = serviceCellDatasetStat(item);
      return `<button type="button" class="service-cell-card ${item.id === window.serviceSelectedCellId ? "selected" : ""}" data-service-overview-open="${escapeHtml(item.id)}" title="查看「${escapeHtml(item.name)}」工程细胞详情">`
        + serviceCellMediaMarkup(item)
        + `<span class="service-cell-body"><strong class="service-cell-name">${escapeHtml(item.name)}</strong>`
        + `<small class="service-cell-sub">${escapeHtml(item.id)} · ${escapeHtml(item.latin || item.species || "物种待补充")}</small>`
        + `<span class="service-cell-tags">${tags.map(tag => `<span class="type">${escapeHtml(tag)}</span>`).join("")}</span>`
        + `<span class="service-cell-intro">${escapeHtml(serviceCellIntro(item))}</span>`
        + `<span class="service-cell-foot"><span class="service-cell-dataset-stat" title="${escapeHtml(stat.title)}">${escapeHtml(stat.text)}</span><em>查看详情 ›</em></span>`
        + `</span></button>`;
    }

    function getServiceQueryMatches(query = "", filters = {}) {
      const normalized = String(query || "").trim().toLowerCase();
      return SERVICE_CELLS.filter(item => {
        const searchable = `${item.id} ${item.name} ${item.latin} ${item.species} ${item.fn} ${item.field} ${item.type} ${item.source}`.toLowerCase();
        return (!normalized || searchable.includes(normalized)) && (!filters.type || item.type === filters.type) && (!filters.field || item.field === filters.field);
      });
    }

    function serviceOverviewDirectoryGrid(items) {
      const list = items || SERVICE_CELLS;
      const isQuery = Boolean(items);
      const head = isQuery
        ? `<div><h3>匹配结果</h3><p>共 ${list.length} 个符合条件的工程细胞 / 菌株，卡片展示细胞示意图、菌株名称、标签与特性简介，点击卡片进入详情页</p></div><span class="service-query-result-note">已匹配 ${list.length} 条</span>`
        : `<div><h3>工程细胞目录</h3><p>共 ${SERVICE_CELLS.length} 个已发布工程细胞 / 菌株，卡片展示细胞示意图、菌株名称、标签与特性简介，点击卡片进入该工程细胞详情页</p></div><span class="service-query-result-note">点击卡片进入详情页</span>`;
      const cards = list.map(serviceCellCardMarkup).join("");
      return `<section class="service-directory-panel"><div class="service-directory-head">${head}</div><div class="service-cell-grid">${cards || `<div class="service-overview-empty">未找到匹配的工程细胞 / 菌株，请调整查询条件后重新查询</div>`}</div></section>`;
    }

    /* 详情页已去掉统计卡片项（概览信息统一放在顶部细胞简介区） */

    /* 细胞类型与来源：后台富文本描述信息（描述信息为空时退回结构化字段） */
    function serviceCellTypeSourceMarkup(cell) {
      const rich = String(cell?.cellTypeDescription || "").trim();
      if (rich) return `<div class="service-application-rich">${rich}</div>`;
      const rows = [["细胞类型", cell?.type], ["细胞来源", cell?.source], ["菌株类型", cell?.strainType]].filter(row => row[1]);
      return rows.length ? `<div class="service-facts half">${rows.map(row => serviceFact(row[0], row[1])).join("")}</div>` : `<div class="service-overview-empty">细胞类型与来源待补充</div>`;
    }

    /* 细胞特性与功能：与后台「工程细胞信息管理 › 细胞特性与功能（富文本描述信息）」同源 */
    function serviceCellTraitMarkup(cell) {
      const clean = value => ["待补充", "待检测", "未检测", "待验证", "—"].includes(String(value || "").trim()) ? "" : String(value || "").trim();
      const rich = clean(cell?.cellTraitDescription) || clean(cell?.biologicalFunction);
      const rows = [
        ["生长速度", clean(cell?.growthRate || cell?.speed)], ["倍增时间", clean(cell?.doublingTime || cell?.doubling)],
        ["细胞大小", clean(cell?.cellSize || cell?.size)], ["细胞形状", clean(cell?.cellShape || cell?.shape)],
        ["核质比", clean(cell?.nuclearCytoRatio || cell?.nucleocytoplasmicRatio)], ["细胞特征与功能", clean(cell?.fn)]
      ].filter(row => row[1]);
      const richBlock = rich ? `<div class="service-func-sub">描述信息</div><div class="service-application-rich">${rich}</div>` : "";
      const facts = rows.length ? `<div class="service-facts half">${rows.map(row => serviceFact(row[0], row[1])).join("")}</div>` : "";
      return (richBlock || facts) ? `${richBlock}${facts}` : `<div class="service-overview-empty">细胞特性与功能待补充，可在后台「工程细胞信息管理」中填写</div>`;
    }

    /* 培养条件：后台「培养条件（富文本描述信息）」；富文本为空时退回结构化培养条件 */
    function serviceCellCultureConditionMarkup(cell) {
      const rich = String(cell?.cultureDescription || "").trim();
      const conditions = serviceCultureConditionRows(cell).filter(row => row[1]);
      const notes = cell?.cultureNotes ? `<p class="service-culture-note">补充说明：${escapeHtml(cell.cultureNotes)}</p>` : "";
      if (rich) return `<div class="service-application-rich">${rich}</div>${notes}`;
      if (conditions.length) return `<div class="service-condition-grid">${conditions.map(row => `<div class="service-condition"><span>${escapeHtml(row[0])}</span><strong>${escapeHtml(row[1])}</strong></div>`).join("")}</div>${notes}`;
      return `<div class="service-overview-empty">该菌株培养条件待补充，可在后台「工程细胞信息管理 › 细胞培养与优化信息」中填写</div>`;
    }

    /* 细胞质量检测：以描述信息展示（与后台录入的质检描述同源） */
    function serviceQcDescriptionOf(cell) {
      if (cell?.qcDescription) return cell.qcDescription;
      return [`细胞活性 ${cell?.activity || "待检测"}`, `细胞纯度 ${cell?.purity || "待检测"}`, `污染检测 ${cell?.contamination || "待检测"}`].join("；");
    }

    function serviceQcMarkup(cell) {
      return `<div class="service-application-rich">${escapeHtml(serviceQcDescriptionOf(cell))}</div>`;
    }

    /* 培养条件：与后台「培养与优化 › 培养条件」配置项同源 */
    function serviceCultureConditionRows(cell) {
      return [
        ["培养温度", cell?.cultureTemperature || cell?.temp], ["培养湿度", cell?.cultureHumidity || cell?.humidity],
        ["pH 值", cell?.culturePh || cell?.ph], ["渗透压", cell?.cultureOsmolarity || cell?.osm],
        ["气体环境", cell?.cultureGas || cell?.gas], ["搅拌转速", cell?.cultureAgitation || cell?.agitation],
        ["通气量", cell?.cultureAeration || cell?.aeration], ["培养时长", cell?.cultureDuration],
        ["接种量", cell?.cultureInoculation], ["补料策略", cell?.cultureFeedStrategy], ["培养批次", cell?.cultureBatches]
      ];
    }

    /* 关联数据集卡片 · 工程细胞培养营养数据集 - 培养基（点击可跳转到数据查询 › 培养基数据集） */
    function serviceOverviewMediumCardMarkup(cell) {
      const parts = String(cell?.medium || "").split(" / ");
      if (!cell?.medium) return `<div class="service-overview-empty">该菌株暂未关联培养基，可在后台「工程细胞信息管理 › 培养与优化」中选择培养基配方</div>`;
      const meta = [cell.mediumCode, cell.species || cell.latin || "工程细胞", cell.type || "培养方案"].filter(Boolean).map(value => escapeHtml(value)).join(" · ");
      return `<article class="service-omics-card service-media-card is-link" data-service-medium-jump="${escapeHtml(cell.medium || "")}" data-service-medium-code="${escapeHtml(cell.mediumCode || "")}" title="点击查看「${escapeHtml(parts[0] || cell.medium)}」培养基配方数据集详情"><span>培</span><div style="min-width:0"><strong>${escapeHtml(parts[0] || "待补充")}</strong><small>${escapeHtml(cell.id)} · ${meta}${parts.length > 1 ? ` · ${escapeHtml(parts.slice(1).join(" / "))}` : ""}</small><small style="display:block;margin-top:4px;color:var(--ink)">培养温度 ${escapeHtml(cell.cultureTemperature || cell.temp || "待补充")} · pH ${escapeHtml(cell.culturePh || cell.ph || "待补充")} · 碳源 ${escapeHtml(cell.carbonSource || "见培养基配方")} · 氮源 ${escapeHtml(cell.nitrogenSource || "见培养基配方")}</small></div></article>`;
    }

    /* 优化策略与效果：后台「优化策略」开关开启时才展示；点击跳转前台「数据分析 › 全流程数据分析」 */
    function serviceOptimizationPanelMarkup(cell) {
      const metric = cell?.optimizationMetric || cell?.result;
      return `<div class="service-overview-optimization"><div class="service-overview-optimization-card"><div class="service-overview-optimization-icon">${icon("dna")}</div><h4>优化策略${cell?.optimizationApproach ? " · " + escapeHtml(cell.optimizationApproach) : ""}</h4><p>${escapeHtml(cell?.optimizationGoal || "基于该菌株特性，智能匹配最优表达与培养策略")}</p><button class="btn primary" type="button" data-service-detail-jump="full-analysis">${icon("chart")}点击查看详情</button></div></div>${cell?.optimizationStrategy ? `<div class="service-application-rich" style="margin-top:14px">${cell.optimizationStrategy}</div>` : ""}<div class="service-facts half" style="margin-top:15px">${serviceFact("优化手段", cell?.optimizationApproach || "—")}${serviceFact("效果指标", metric || "待补充")}${serviceFact("验证批次", cell?.optimizationBatches || cell?.cultureBatches || "待补充")}${serviceFact("优化策略", "已开启", "var(--green)")}</div>`;
    }

    /* 优化方案入口：基于该菌株特性匹配最优表达与培养策略 */
    function serviceOptimizationMarkup(cell) {
      const enabled = cell?.optimizationEnabled !== false;
      if (!enabled) return `<div class="service-overview-empty">该菌株暂未开启优化策略展示，可在后台「工程细胞信息管理 › 培养与优化」中开启并填写优化策略</div>`;
      return serviceOptimizationPanelMarkup(cell);
    }

    /* 详情页 Tab 定义：与后台「工程细胞信息管理」新增页四大分区一一对应 */
    function serviceCellDetailTabs() {

      document.body.style.overflow = "hidden";

      dialog.addEventListener("close", () => { dialog.remove(); document.body.style.overflow = previousOverflow; }, { once: true });
      dialog.showModal();
      return dialog;
    }

    function ingestionDetailGroups(module) {
      return [{ title: "基础信息", fields: INGESTION_COMMON_FIELDS }, ...(INGESTION_SCHEMAS[module]?.groups || [])];
    }

    function ingestionDetailValue(field, record) {
      let value = record[field.key];
      if ((value == null || value === "" || (Array.isArray(value) && !value.length)) && field.key === "tableIds2") value = record.tableIds;
      if (field.key === "tableIds" || field.key === "tableIds2") {
        const names = Array.isArray(value) ? value : value ? [value] : [];
        return names.map(name => `<button class="panel-link" data-ingestion-source-table="${escapeHtml(name)}">${escapeHtml(name)}</button>`).join("、") || "-";
      }
      if (field.type === "multiselect") return (Array.isArray(value) ? value : value ? [value] : []).map(item => `<span class="tag">${escapeHtml(item)}</span>`).join("") || "-";
      if (field.type === "file") return ingestionFileTags(value);
      if (field.type === "kv") return (value && value.length)
        ? `<div class="kv-table">${value.map(row => `<div class="kv-row"><input disabled value="${escapeHtml(row.k || "-")}"><input disabled value="${escapeHtml(row.v || "-")}"><input disabled value="${escapeHtml(row.u || "-")}"></div>`).join("")}</div>`
        : "-";
      if (field.key === "status") return `<span class="status status-${escapeHtml(record.status || "草稿")}">${escapeHtml(record.status || "草稿")}</span>`;
      if (field.key === "dataSource") return escapeHtml(ingestionRecordSource(record));
      return escapeHtml(value || "-");
    }

    /* 查看详情正文：分组表格式（与「数据入库」查看详情一致）+ 关联源数据表 */
    function ingestionRecordDetailSections(module, record) {
      if (INGESTION_CUSTOM_DETAIL_MODULES.includes(module)) return ingestionMediumDetailSections(record) + ingestionSourceTablesSection(record);
      const groups = ingestionDetailGroups(module).map(group => `<div class="fgroup"><div class="fgroup-title">${escapeHtml(group.title)}</div><table class="detail-table">${group.fields.map(field => `<tr><td>${escapeHtml(field.label)}</td><td>${ingestionDetailValue(field, record)}</td></tr>`).join("")}</table></div>`).join("");
      return groups + ingestionSourceTablesSection(record);
    }

    /* ===== 培养基数据集详情：参考后台「工程细胞培养营养数据集 - 培养基」的配方详情结构 ===== */
    function ingestionMediumCompositionRows(composition) {
      const rows = Array.isArray(composition) ? composition : [];
      if (!rows.length) return `<tr><td class="dataset-query-empty" colspan="6">暂无组分明细</td></tr>`;
      return rows.map(row => `<tr><td><strong>${escapeHtml(row.name || "-")}</strong></td><td>${escapeHtml(row.type || "-")}</td><td>${escapeHtml(row.amount || "-")}</td><td>${escapeHtml(row.unit || "-")}</td><td>${escapeHtml(row.conc || "-")}</td><td>${escapeHtml(row.note || "-")}</td></tr>`).join("");
    }

    function ingestionMediumTagList(value) {
      const list = Array.isArray(value) ? value : value ? [value] : [];
      return list.length ? list.map(item => `<span class="tag blue">${escapeHtml(item)}</span>`).join("") : "-";
    }

    function ingestionMediumDetailSections(record) {
      const metaRows = [
        ["培养基类型", record.mediumType], ["适用阶段", record.cultureStage], ["最终 pH", record.finalPh],
        ["配制体积", record.finalVolume], ["灭菌方式", record.sterilization], ["保存条件与有效期", record.shelfLife],
        ["数据来源", ingestionRecordSource(record)], ["数据版本", record.version], ["提交人 / 机构", `${record.submitter || "-"} · ${record.institution || "-"}`],
        ["提交日期", record.submitDate], ["关联数据标准", record.standardId], ["当前状态", record.status]
      ].filter(row => row[1]).map(row => `<tr><td>${escapeHtml(row[0])}</td><td>${escapeHtml(row[1])}</td></tr>`).join("");
      const steps = (Array.isArray(record.preparationSteps) ? record.preparationSteps : []).map((step, index) => `<li><span>${index + 1}</span><p>${escapeHtml(step)}</p></li>`).join("");
      return `<div class="fgroup"><div class="fgroup-title">配方属性</div><table class="detail-table">${metaRows}</table></div>
        <div class="fgroup"><div class="fgroup-title">配方组分（Main sol. 1 · 配制体积 ${escapeHtml(record.finalVolume || "—")}）</div>
          <div class="table-wrap"><table class="detail-table medium-composition-table"><thead><tr><th>成分名称</th><th>组分类型</th><th>用量</th><th>单位</th><th>浓度</th><th>备注</th></tr></thead><tbody>${ingestionMediumCompositionRows(record.composition)}</tbody></table></div>
        </div>
        ${steps ? `<div class="fgroup"><div class="fgroup-title">配制步骤</div><ol class="ingestion-medium-steps">${steps}</ol></div>` : ""}
        ${record.preparationNote ? `<div class="fgroup"><div class="fgroup-title">配制说明</div><p class="ingestion-medium-note">${escapeHtml(record.preparationNote)}</p></div>` : ""}
        <div class="fgroup"><div class="fgroup-title">适用菌株 / 细胞</div><div class="ingestion-medium-tags">${ingestionMediumTagList(record.mediumStrains && record.mediumStrains.length ? record.mediumStrains : record.strainIds)}</div></div>
        <div class="fgroup"><div class="fgroup-title">相似 / 同系列培养基</div><div class="ingestion-medium-tags">${ingestionMediumTagList(record.relatedMedia)}</div></div>
        <div class="fgroup"><div class="fgroup-title">数据说明</div><p class="ingestion-medium-note">${escapeHtml(record.remark || "—")}</p></div>`;
    }

    function ingestionQuerySelect(id, label, values, selected) {
      return `<select class="filter-select" id="${id}" aria-label="${escapeHtml(label)}"><option value="">${escapeHtml(label)}</option>${values.map(value => `<option value="${escapeHtml(value)}" ${value === selected ? "selected" : ""}>${escapeHtml(value)}</option>`).join("")}</select>`;
    }

    function renderIngestionQuery() {
      const pageKey = ingestionQueryPageKey();
      const page = INGESTION_QUERY_PAGES[pageKey];
      const filters = ingestionQueryFilters(pageKey);
      const allRecords = ingestionModuleRecords(page.module);
      const records = ingestionFilteredRecords(pageKey);
      const sourceValues = [...new Set(allRecords.map(ingestionRecordSource))];
      const isMedium = page.module === "medium";
      /* 表头与行：培养基数据集按「培养基类型 / 适用阶段 / 关联菌株 / 最终 pH」展示，其余模块沿用数据入库列口径 */
      const heads = isMedium
        ? ["入库任务编号", "数据集编码", "培养基类型", "培养基名称", "适用阶段", "适用菌株 / 细胞", "最终 pH", "状态", "提交日期", "操作"]
        : ["入库任务编号", "数据集编码", "数据集类型", "数据集名称", "关联菌株名称", "关联数据标准", "状态", "数据来源", "提交日期", "操作"];
      const rows = records.map(record => {
        const detailButton = `<button class="table-link" data-ingestion-detail="${escapeHtml(record.dataId)}" data-ingestion-module="${page.module}">查看详情</button>`;
        const applyButton = `<button class="panel-link" data-ingestion-apply="${escapeHtml(record.dataId)}" data-ingestion-module="${page.module}">申请使用</button>`;
        return `<tr>
            <td><button class="table-link" data-ingestion-detail="${escapeHtml(record.dataId)}" data-ingestion-module="${page.module}" title="${escapeHtml(record.dataId)}">${escapeHtml(record.dataId)}</button></td>
            <td>${escapeHtml(record.dataSetCode || "-")}</td>
            ${isMedium
              ? `<td>${escapeHtml(record.mediumType || "-")}</td>
            <td><strong title="${escapeHtml(record.dataName)}">${escapeHtml(record.dataName)}</strong></td>
            <td>${escapeHtml(record.cultureStage || "-")}</td>
            <td>${(record.mediumStrains || record.strainIds || []).map(item => `<span class="tag">${escapeHtml(item)}</span>`).join("") || "-"}</td>
            <td>${escapeHtml(record.finalPh || "-")}</td>
            <td>${ingestionStatusTag(record.status)}</td>
            <td>${escapeHtml(record.submitDate || "-")}</td>`
              : `<td>${escapeHtml(record.dataType || "-")}</td>
            <td><strong title="${escapeHtml(record.dataName)}">${escapeHtml(record.dataName)}</strong></td>
            <td>${(record.strainIds || []).map(item => `<span class="tag">${escapeHtml(item)}</span>`).join("") || "-"}</td>
            <td>${escapeHtml(record.standardId || "-")}</td>
            <td>${ingestionStatusTag(record.status)}</td>
            <td>${escapeHtml(ingestionRecordSource(record))}</td>
            <td>${escapeHtml(record.submitDate || "-")}</td>`}
            <td class="row-actions">${detailButton}${applyButton}</td>
          </tr>`;
      }).join("");
      return `<div class="dataset-query-page ingestion-query-page">
        ${pageHeader(page.title, page.note, "", { showActions: false })}
        <section class="panel dataset-query-panel">
          <div class="service-readonly-note">${INGESTION_QUERY_READONLY_NOTE}</div>
          <div class="dataset-query-toolbar">
            <div class="search-box">${icon("search")}<input id="ingestionQueryKeyword" value="${escapeHtml(filters.keyword || "")}" placeholder="${isMedium ? "搜索入库任务编号、数据集编码、培养基名称或组分" : "搜索入库任务编号、数据集编码、名称或菌株"}" autocomplete="off"></div>
            <select class="filter-select" id="ingestionQuerySource" aria-label="全部数据来源"><option value="">全部数据类型</option>${sourceValues.map(value => `<option value="${escapeHtml(value)}" ${value === (filters.source || "") ? "selected" : ""}>${escapeHtml(value)}</option>`).join("")}</select>
            ${isMedium ? "" : ingestionQuerySelect("ingestionQueryStandard", "全部数据标准", INGESTION_STANDARDS, filters.standard || "")}
            ${ingestionQuerySelect("ingestionQueryStatus", "全部状态", INGESTION_STATUS, filters.status || "")}
            <button class="btn primary" data-ingestion-query-action="query">${icon("search")}查询</button>
            <button class="btn" data-ingestion-query-action="reset">重置</button>
          </div>
          <div class="table-wrap">
            <table class="dataset-query-table" id="ingestionQueryTable">
              <thead><tr>${heads.map(head => `<th>${escapeHtml(head)}</th>`).join("")}</tr></thead>
              <tbody>${rows || `<tr><td class="dataset-query-empty" colspan="10">暂无符合查询条件的数据</td></tr>`}</tbody>
            </table>
          </div>
          <div class="dataset-library-pagination"><span>共 <strong id="ingestionQueryVisibleCount">${records.length}</strong> 条</span><span>数据来源：${escapeHtml(page.source)}（${isMedium ? "与后台工程细胞培养营养数据集 - 培养基同源" : "与数据入库页面同源"}）</span></div>
        </section>
      </div>`;
    }

    function renderQuery() {
      return renderIngestionQuery();
    }

    function openIngestionRecordDetail(module, dataId) {
      const record = ingestionFindRecord(module, dataId);
      if (!record) return;
      const page = Object.values(INGESTION_QUERY_PAGES).find(item => item.module === module);
      const drawer = document.createElement("dialog");
      drawer.className = "phenotype-drawer ingestion-detail-drawer";
      drawer.innerHTML = `<header><h3>查看 · ${escapeHtml(page?.source || "数据入库")}<span class="src-sub">${escapeHtml(record.dataName)}（${escapeHtml(record.dataId)}）</span></h3><button class="icon-button" data-close aria-label="关闭详情" title="关闭详情">×</button></header>
        <div class="phenotype-drawer-body">
          <div class="service-readonly-note">当前为前台只读视图，字段分组与取值方式与「${escapeHtml(page?.source || "数据入库")}」查看详情同源，可查看数据详情或提交使用申请。</div>
          ${ingestionRecordDetailSections(module, record)}
        </div>
        <footer><button class="btn" data-close>关闭</button><button class="btn primary" data-ingestion-apply="${escapeHtml(record.dataId)}" data-ingestion-module="${module}">申请使用</button></footer>`;
      document.body.append(drawer);
      const previousOverflow = document.body.style.overflow;
      document.body.style.overflow = "hidden";
      drawer.querySelectorAll("[data-close]").forEach(button => button.addEventListener("click", () => drawer.close()));
      drawer.querySelector("[data-ingestion-apply]")?.addEventListener("click", () => { drawer.close(); openIngestionApplyDialog(module, dataId); });
      drawer.querySelectorAll("[data-ingestion-source-table]").forEach(button => button.addEventListener("click", () => openIngestionSourceTableDialog(button.dataset.ingestionSourceTable)));
      drawer.addEventListener("close", () => { drawer.remove(); document.body.style.overflow = previousOverflow; }, { once: true });
      drawer.showModal();
      return drawer;
    }

    function openIngestionApplyDialog(module, dataId) {
      const record = ingestionFindRecord(module, dataId);
      if (!record) return;
      const drawer = document.createElement("dialog");
      drawer.className = "phenotype-drawer";
      drawer.innerHTML = `<header><h3>申请使用数据 · ${escapeHtml(record.dataName)}</h3><button class="icon-button" data-close aria-label="关闭申请" title="关闭申请">×</button></header>
        <div class="phenotype-drawer-body">
          <section class="dataset-drawer-section"><h4>申请对象</h4><dl class="dataset-detail-grid"><dt>入库任务编号</dt><dd>${escapeHtml(record.dataId)}</dd><dt>数据集编码</dt><dd>${escapeHtml(record.dataSetCode || "-")}</dd><dt>数据集名称</dt><dd>${escapeHtml(record.dataName)}</dd><dt>关联数据标准</dt><dd>${escapeHtml(record.standardId || "-")}</dd><dt>数据来源</dt><dd>${escapeHtml(ingestionRecordSource(record))}</dd><dt>当前状态</dt><dd>${ingestionStatusTag(record.status)}</dd></dl></section>
          <form id="ingestionApplyForm" class="phenotype-form">
            <label>申请用途<textarea name="purpose" rows="2" required placeholder="说明数据使用场景、分析目标与预期成果"></textarea></label>
            <label>使用范围<select name="scope"><option>仅本人查询与统计</option><option>项目组内共享分析</option><option>用于论文与成果发表</option><option>用于产品化与产业转化</option></select></label>
            <label>期望使用期限<select name="period"><option>1 个月</option><option>3 个月</option><option>6 个月</option><option>12 个月</option></select></label>
            <label>申请人<input name="applicant" value="张明" required></label>
            <label>所属机构<input name="institution" value="国际科技信息中心" required></label>
            <label>联系方式<input name="contact" placeholder="手机号或邮箱" required></label>
            <label class="full">备注<textarea name="remark" rows="2" placeholder="补充说明（选填）"></textarea></label>
          </form>
        </div>
        <footer><button class="btn" data-close>取消</button><button class="btn primary" type="submit" form="ingestionApplyForm">提交申请</button></footer>`;
      document.body.append(drawer);
      const previousOverflow = document.body.style.overflow;
      document.body.style.overflow = "hidden";
      drawer.querySelectorAll("[data-close]").forEach(button => button.addEventListener("click", () => drawer.close()));
      drawer.querySelector("#ingestionApplyForm")?.addEventListener("submit", event => {
        event.preventDefault();
        const values = Object.fromEntries(new FormData(event.currentTarget).entries());
        if (!String(values.purpose || "").trim()) { showToast("请填写申请用途"); return; }
        const applyId = `EC-APPLY-${new Date().toISOString().slice(0, 10).replace(/-/g, "")}-${String(window.ingestionApplyRecords.length + 1).padStart(4, "0")}`;
        window.ingestionApplyRecords.push({ applyId, module, dataId: record.dataId, dataName: record.dataName, ...values, applyTime: new Date().toISOString().slice(0, 16).replace("T", " "), status: "待审核", reviewer: "王思远（数据资源管理员）", reviewTime: "" });
        drawer.close();
        showToast(`使用申请已提交：${applyId}，等待数据管理员审核`);
        if (state.page === "my-applications") renderPage();
      });
      drawer.addEventListener("close", () => { drawer.remove(); document.body.style.overflow = previousOverflow; }, { once: true });
      drawer.showModal();
      return drawer;
    }

    /* ===== 前台 · 我的申请记录（数据查询 › 我的申请记录）
       展示当前用户提交的数据使用申请、审核进度与授权结果，
       覆盖「审核中 / 申请通过 / 申请驳回」三种原型效果。 ===== */
    const MY_APPLICATION_STATUS = {
      "待审核": { tone: "blue", cls: "pending", label: "待审核", stat: "pending", statLabel: "待审核" },
      "已通过": { tone: "green", cls: "passed", label: "已通过", stat: "passed", statLabel: "申请通过" },
      "已驳回": { tone: "red", cls: "rejected", label: "已驳回", stat: "rejected", statLabel: "申请驳回" }
    };
    const MY_APPLICATION_MODULE_LABEL = { gpa: "GPA数据集", omics: "多组学数据集", ferment: "发酵标准数据集" };
    window.myApplicationFilters = window.myApplicationFilters || { keyword: "", status: "" };

    function myApplicationStatusOf(record) {
      const status = record && record.status;
      return MY_APPLICATION_STATUS[status] ? status : "待审核";
    }

    function myApplicationRecords() {
      return (window.ingestionApplyRecords || [])
        .slice()
        .sort((a, b) => String(b.applyTime || "").localeCompare(String(a.applyTime || "")));
    }

    function myApplicationFiltered() {
      const filters = window.myApplicationFilters || { keyword: "", status: "" };
      const keyword = String(filters.keyword || "").trim().toLowerCase();
      return myApplicationRecords().filter(record => {
        if (filters.status && myApplicationStatusOf(record) !== filters.status) return false;
        if (!keyword) return true;
        const hay = [record.applyId, record.dataId, record.dataName, record.applyTime, record.applicant, record.institution, record.purpose]
          .join(" ").toLowerCase();
        return hay.includes(keyword);
      });
    }

    function myApplicationControls() {
      return {
        keyword: document.getElementById("myApplicationKeyword")?.value || "",
        status: document.getElementById("myApplicationStatus")?.value || ""
      };
    }

    function myApplicationResultBanner(record) {
      const status = myApplicationStatusOf(record);
      if (status === "已通过") {
        return `<div class="apply-result passed"><div class="ar-icon">✓</div><div class="ar-body">
          <div class="ar-title">申请通过 · 数据使用授权已生效</div>
          <div class="ar-desc">审核人 ${escapeHtml(record.reviewer || "-")} 于 ${escapeHtml(record.reviewTime || "-")} 通过本申请；授权编号 ${escapeHtml(record.grantId || "-")}，有效期 ${escapeHtml(record.grantPeriod || "-")}。可在授权范围内查看该数据集。</div>
        </div></div>`;
      }
      if (status === "已驳回") {
        return `<div class="apply-result rejected"><div class="ar-icon">!</div><div class="ar-body">
          <div class="ar-title">申请驳回 · 需按审核意见调整后重新提交</div>
          <div class="ar-desc">审核人 ${escapeHtml(record.reviewer || "-")} 于 ${escapeHtml(record.reviewTime || "-")} 驳回本申请，本次申请未获得数据使用授权。驳回原因与整改建议见下方「审核结果」。</div>
        </div></div>`;
      }
      return `<div class="apply-result pending"><div class="ar-icon">i</div><div class="ar-body">
        <div class="ar-title">审核中 · 申请已提交，等待数据管理员审核</div>
        <div class="ar-desc">提交时间 ${escapeHtml(record.applyTime || "-")}。审核完成后结果会同步到本页面，授权通过后开放该数据集的查看入口。</div>
      </div></div>`;
    }

    function myApplicationReviewSection(record) {
      const status = myApplicationStatusOf(record);
      if (status === "已通过") {
        return `<dl class="dataset-detail-grid">
          <dt>审核结论</dt><dd>${statusTag("已通过", "green")}</dd>
          <dt>授权编号</dt><dd>${escapeHtml(record.grantId || "-")}</dd>
          <dt>审核人</dt><dd>${escapeHtml(record.reviewer || "-")}</dd>
          <dt>审核时间</dt><dd>${escapeHtml(record.reviewTime || "-")}</dd>
          <dt>授权有效期</dt><dd>${escapeHtml(record.grantPeriod || "-")}</dd>
          <dt>授权使用范围</dt><dd>${escapeHtml(record.scope || "-")}</dd>
          <dt>审核意见</dt><dd>${escapeHtml(record.reviewComment || "-")}</dd>
        </dl>`;
      }
      if (status === "已驳回") {
        return `<dl class="dataset-detail-grid" style="margin-bottom:14px">
          <dt>审核结论</dt><dd>${statusTag("已驳回", "red")}</dd>
          <dt>审核人</dt><dd>${escapeHtml(record.reviewer || "-")}</dd>
          <dt>审核时间</dt><dd>${escapeHtml(record.reviewTime || "-")}</dd>
        </dl>
        <div class="apply-reject-box">
          <h5>驳回原因</h5><p>${escapeHtml(record.rejectReason || record.reviewComment || "-")}</p>
          <h5>整改建议</h5><p>${escapeHtml(record.rejectAdvice || "-")}</p>
        </div>`;
      }
      return `<div class="apply-progress">
        <div class="apply-progress-step done"><div class="ap-dot">✓</div><div class="ap-text"><strong>提交使用申请</strong><small>${escapeHtml(record.applyTime || "-")} · 申请已进入审核队列</small></div></div>
        <div class="apply-progress-step doing"><div class="ap-dot">2</div><div class="ap-text"><strong>数据管理员审核</strong><small>审核中 · 审核人 ${escapeHtml(record.reviewer || "数据资源管理员")}</small></div></div>
        <div class="apply-progress-step"><div class="ap-dot">3</div><div class="ap-text"><strong>授权生效 / 结果反馈</strong><small>待开始 · 审核通过后开放授权范围内的数据查看</small></div></div>
      </div>`;
    }

    function renderMyApplications() {
      const filters = window.myApplicationFilters || { keyword: "", status: "" };
      const all = myApplicationRecords();
      const list = myApplicationFiltered();
      const countOf = status => all.filter(record => myApplicationStatusOf(record) === status).length;
      const rows = list.map(record => {
        const status = myApplicationStatusOf(record);
        const meta = MY_APPLICATION_STATUS[status];
        const actions = [`<button class="panel-link" data-myapply-detail="${escapeHtml(record.applyId)}">查看详情</button>`];
        if (status === "已通过") actions.push(`<button class="panel-link" data-myapply-dataset="${escapeHtml(record.dataId)}" data-myapply-module="${escapeHtml(record.module)}">查看数据</button>`);
        if (status === "已驳回") actions.push(`<button class="panel-link" data-myapply-reapply="${escapeHtml(record.dataId)}" data-myapply-module="${escapeHtml(record.module)}">重新申请</button>`);
        return `<tr>
          <td><button class="table-link" data-myapply-detail="${escapeHtml(record.applyId)}" title="${escapeHtml(record.applyId)}">${escapeHtml(record.applyId)}</button></td>
          <td><strong title="${escapeHtml(record.dataName || "-")}">${escapeHtml(record.dataName || "-")}</strong></td>
          <td>${escapeHtml(record.dataId || "-")}</td>
          <td>${escapeHtml(MY_APPLICATION_MODULE_LABEL[record.module] || record.module || "-")}</td>

      { type: "stability", strainNo: "BY4741-G007", strainName: "酿酒酵母 BY4741 / GPD1 敲除", gene: "GPD1 敲除", perturbation: "敲除", compound: "乙醇", phenotype: "产物稳定性", pheno: { "产物类型": "初级代谢产物", "产物名称": "乙醇", "产物存续时间": "92 h" } }

    function gpaNormalize(value) {
      return String(value == null ? "" : value).toLowerCase().replace(/[\s\-_·、，,。.；;：:／/\\|（）()【】\[\]{}<>+×*"'’“”]+/g, "");
    }
    function filterGpaRecords() {
      /* 仅按菌株编号 / 名称模糊过滤（已去掉基因特征过滤）：点选的菌株以编号精确命中 */
      const query = window.gpaQueryState || {};
      const name = gpaNormalize(query.name);
      return GPA_RECORDS.filter(record => {
        if (name) {
          const nameText = gpaNormalize([record.strainNo, record.strainName].join(" "));
          if (!nameText.includes(name)) return false;
        }
        return true;
      });
    }
    // 菌株下拉候选：一株 = 一个数据集；关键字按编号/名称归一化做模糊匹配
    function gpaStrainCatalog() {
      const catalog = new Map();
      GPA_RECORDS.forEach(record => {
        if (!catalog.has(record.strainNo)) catalog.set(record.strainNo, { strainNo: record.strainNo, strainName: record.strainName, key: gpaNormalize(record.strainNo + " " + record.strainName) });
      });
      return [...catalog.values()];
    }
    function hideGpaStrainSuggest() {
      const box = document.getElementById("gpaStrainSuggest");
      if (box) { box.classList.remove("open"); box.innerHTML = ""; }

    function gpaRankRecord(record) {
      const order = { env: 0, growth: 1, yield: 2, stability: 3 };
      return order[record.type] === undefined ? 9 : order[record.type];
    }
    function gpaTypeConclusion(records) {
      if (!records.length) return "";
      const type = records[0].type;
      const uniq = values => [...new Set(values.filter(Boolean))].join("、");
      if (type === "env") {
        const temps = uniq(records.map(r => r.pheno["温度"]));
        const oxy = uniq(records.map(r => r.pheno["氧浓度"]));
        if (records.length === 1) {
          return `在温度 ${temps}、氧浓度 ${oxy} 的条件下，该菌株基因型稳定性为「${records[0].pheno["基因型稳定性"] || "—"}」`;
        }
        const stable = records.filter(r => {
          const level = r.pheno["基因型稳定性"] || "";
          return level.indexOf("稳定") >= 0 && level.indexOf("部分") < 0;
        }).length;
        return `在温度 ${temps}、氧浓度 ${oxy} 的条件下，${records.length} 条环境因子记录中 ${stable} 条判定为完全稳定`;
      }
      if (type === "growth") {
        if (records.length === 1) {
          // compound 为胁迫化合物（"—" 或缺失 = 常规培养条件、无胁迫）；产物类记录的 compound 是目标产物，不得当作胁迫依据
          const stress = records[0].compound && records[0].compound !== "—" ? records[0].compound : "";
          const rate = records[0].pheno["生长速率"] || "—";
          return stress ? `在${stress}胁迫下测得生长速率 ${rate}` : `常规培养条件下测得生长速率 ${rate}`;
        }
        const rates = records.map(r => parseFloat(r.pheno["生长速率"])).filter(v => !isNaN(v));
        if (!rates.length) return `共 ${records.length} 条生长速率记录`;
        const best = Math.max.apply(null, rates);
        const worst = Math.min.apply(null, rates);
        return best === worst
          ? `${records.length} 条记录生长速率均为 ${best} h⁻¹，生长表现一致`
          : `生长速率区间 ${worst}–${best} h⁻¹，最优 ${best} h⁻¹`;
      }
      if (type === "yield") {
        if (records.length === 1) {
          const record = records[0];
          return `产物${record.pheno["产物名称"] || "—"}（${record.pheno["产物类型"] || "—"}）产量为 ${record.pheno["产物产量"] || "—"}`;
        }
        const top = records.slice().sort((a, b) => parseFloat(b.pheno["产物产量"]) - parseFloat(a.pheno["产物产量"]))[0];
        return `检出产物 ${uniq(records.map(r => r.pheno["产物名称"]))}，产量最高为 ${top.pheno["产物名称"]} ${top.pheno["产物产量"]}`;
      }
      if (type === "stability") {
        if (records.length === 1) {
          const record = records[0];
          return `产物${record.pheno["产物名称"] || "—"}存续时间为 ${record.pheno["产物存续时间"] || "—"}`;
        }
        const longest = records.slice().sort((a, b) => parseFloat(b.pheno["产物存续时间"]) - parseFloat(a.pheno["产物存续时间"]))[0];
        return `产物 ${uniq(records.map(r => r.pheno["产物名称"]))} 中存续时间最长为 ${longest.pheno["产物名称"]} ${longest.pheno["产物存续时间"]}`;
      }
      return `共 ${records.length} 条记录`;
    }
    function renderGpaPhenotypeAnalysis() {
      /* GPA 数据查询：菌株编号/名称模糊搜索（下拉点选唯一菌株，已去掉基因特征选项），只有点「分析」才检索 */

      if (!query.label) window.gpaStrainPicked = null;

      // 命中按菌株分组：一株菌株的数据完整展示完（基本信息 + 各类结论），再在下方继续展示第二株
      const strainGroups = [];
      const strainIndex = {};
      hits.forEach(record => {
        if (strainIndex[record.strainNo] === undefined) {
          strainIndex[record.strainNo] = strainGroups.length;
          strainGroups.push({ strainNo: record.strainNo, records: [] });
        }
        strainGroups[strainIndex[record.strainNo]].records.push(record);
      });
      const resultHead = searched
        ? (strainGroups.length
            ? statusTag("共 " + strainGroups.length + " 个菌株 · " + hits.length + " 条记录", "green")

        : statusTag("尚未分析", "gray");

      // 每个菌株一个完整 panel：基本信息（基因型 + 表型汇总 两块）
      // → 按 环境因子 → 生长速率 → 产物产量 → 产物稳定性 依次给出该类结论 + 明细表；没有该类数据就跳过
      let conclusion = "";
      if (searched && strainGroups.length) {
        conclusion = strainGroups.map((strain, index) => {
          const head = strain.records[0];
          const dataset = GPA_DATASETS[strain.strainNo] || { code: "—", name: "—", source: "—" };
          const coverage = GPA_DATASET_TYPES
            .map(meta => {
              const count = strain.records.filter(record => record.type === meta.key).length;
              return count ? meta.short + " ×" + count : "";
            })
            .filter(Boolean).join(" · ");
          // 基本信息平铺单卡：编码 → 名称 → 菌株编号 → 菌株名称（已去掉基因特征行）；数据来源在各明细表末列展示

          const groups = GPA_DATASET_TYPES
            .map(type => ({ type, records: strain.records.filter(record => record.type === type.key) }))

          const groupBlocks = groups.map(group => {

            const rows = group.records.map(record => {

          }).join("");
          return `<section class="panel analysis-section"><div class="panel-head"><div><h3>基本信息 · 分析结论</h3></div>${statusTag("第 " + (index + 1) + " / " + strainGroups.length + " 株", "blue")}</div>
            ${basic}${groupBlocks}</section>`;
        }).join("");
      }

      const resultBody = searched
        ? (hits.length ? conclusion : `<div class="gpa-card-empty">未分析到符合条件的记录，请调整菌株编号/名称后重新分析</div>`)
        : `<div class="gpa-card-empty">请先搜索并从下拉列表选择 1 个菌株，再点击「分析」查看结论</div>`;

      return `<div class="data-analysis-page">
        <div class="page-heading"><div><h2>基因-表型数据分析</h2></div></div>
        <section class="panel analysis-query-panel gpa-query-panel"><div class="analysis-query-head"><div><h3>GPA 数据查询</h3><p>以「菌株编号/名称」检索基因型-表型关联记录，按菌株分组完整展示各类数据的分析结论</p></div></div>

      </div>`;
    }

    function findMenuItem(items, key) {
      for (const item of items) {
        if (item.key === key) return item;
        if (item.children) {
          const found = findMenuItem(item.children, key);
          if (found) return found;
        }
      }
      return null;
    }

    function findMenuPath(items, key, parents = []) {
      for (const item of items) {
        const nextParents = [...parents, item];
        if (item.key === key) return nextParents;
        if (item.children) {
          const found = findMenuPath(item.children, key, nextParents);
          if (found) return found;
        }
      }
      return null;
    }

    function renderPage() {

      const menuPath = findMenuPath(PORTALS.front.menus, state.page) || [menu];

    /* 培养基名称 / 编号 → 培养基数据集记录（供详情页跳转定位使用） */
    function mediumDatasetRecord(name, code) {
      const list = INGESTION_DB.medium || [];
      const clean = value => String(value || "").trim().toLowerCase();
      const byCode = code ? list.find(record => clean(record.dataSetCode) === clean(code) || clean(record.files?.[0]) === clean(code)) : null;
      if (byCode) return byCode;
      const byExactName = list.find(record => clean(record.dataName) === clean(name));
      if (byExactName) return byExactName;
      /* 培养基名称形如「CGXII / 发酵培养基」，按首个关键词做模糊匹配 */
      const keyword = clean(String(name || "").split("/")[0]);
      if (!keyword) return list[0] || null;
      return list.find(record => clean(record.dataName).includes(keyword) || keyword.includes(clean(record.dataName).split(" ")[0])) || list[0] || null;
    }

        g.addEventListener("click",event=>{event.stopPropagation();if(graphState[module].lastDragged===n.id){graphState[module].lastDragged=null;return}selectNode(module,n.id)});
        g.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();selectNode(module,n.id)}});
        const bg=n.type==="blue"?"#e4f0f8":n.type==="teal"?"#e2f3f0":n.type==="violet"?"#eeecfa":n.type==="amber"?"#fff2d9":"#fbe9e7";
        const fill=n.type==="blue"?"#216fae":n.type==="teal"?"#218c87":n.type==="violet"?"#6d62b6":n.type==="amber"?"#b97b21":"#bd675f";
        g.appendChild(svg("rect",{x:0,y:0,width:n.w,height:n.h,rx:8,class:"shell",fill:bg}));
        g.appendChild(svg("rect",{x:0,y:0,width:6,height:n.h,rx:3,class:"bar",fill}));
        g.appendChild(svg("circle",{cx:25,cy:25,r:12,fill}));
        const mark=svg("text",{x:25,y:29,"text-anchor":"middle",class:"node-mark"});mark.textContent=n.type==="blue"?"基":n.type==="teal"?"数":n.type==="violet"?"模":n.type==="amber"?"工":"果";g.appendChild(mark);
        const title=svg("text",{x:47,y:wrap(n.label,10).length===1?34:27,class:"node-title"});wrap(n.label,10).forEach((row,i)=>{const s=svg("tspan",{x:47,dy:i?16:0});s.textContent=row;title.appendChild(s)});g.appendChild(title);
        const kind=svg("text",{x:47,y:57,class:"node-kind"});kind.textContent=n.kind;g.appendChild(kind);nodeLayer.appendChild(g);
        g.addEventListener("mouseenter",event=>{g.classList.add("hovered");showTooltip(module,nodeTooltip(module,n),event)});
        g.addEventListener("mousemove",event=>positionTooltip(module,event));
        g.addEventListener("mouseleave",()=>{g.classList.remove("hovered");hideTooltip(module)});
        g.addEventListener("focus",event=>showTooltip(module,nodeTooltip(module,n),event));
        g.addEventListener("blur",()=>hideTooltip(module));
      });
      const countEl=$(`#${module}Count`);if(countEl)countEl.textContent=`中心 1 · 可见 ${visible.size} 节点 · ${graphEdges(module).filter(([a,b])=>visible.has(a)&&visible.has(b)).length} 条关系`;
      updateZoomLabel(module);
    }
    const initialPositions={strain:Object.fromEntries(strainNodes.map(n=>[n.id,{x:n.x,y:n.y}]))};
    function edgeIsConfirmed(module,a,b){return confirmedEdgeKeys.has(edgeKey(module,a,b))||confirmedEdgeKeys.has(edgeKey(module,b,a))}
    function relationRef(module,a,b){return `${module}|${a}|${b}`}
    function ensureFilterForNode(module,id){const filter=nodeFilter[module][id],button=$(`[data-kg-view="${module}"] .filter-button[data-kg-filter="${filter}"]`);if(button&&!button.classList.contains("active"))button.classList.add("active")}
    function centerOn(module,id){
      const node=maps[module][id];if(!node)return;
      const state=graphState[module];state.panX=450-node.x*state.zoom;state.panY=295-node.y*state.zoom;renderGraph(module);
    }
    function detail(module,id){
      const n=maps[module][id],ids={title:"strainDetailTitle",type:"detailType",desc:"detailDesc",props:"detailProps",tags:"detailTags",tagsCount:"detailTagsCount",relationCount:"detailRelationCount",focus:"detailRelationFocus",relations:"detailRelations",source:"detailSource"};
      $(`#${ids.title}`).textContent=n.label;$(`#${ids.type}`).textContent=n.kind;$(`#${ids.desc}`).textContent=n.desc;
      $(`#${ids.props}`).innerHTML=n.props.map(([k,v])=>`<div class="prop"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("");
      $(`#${ids.tags}`).innerHTML=n.tags.map(t=>`<span class="data-tag">${esc(t)}</span>`).join("");$(`#${ids.tagsCount}`).textContent=`${n.tags.length} 类`;$(`#${ids.source}`).textContent=n.source;
      const rs=graphEdges(module).filter(([a,b])=>a===id||b===id);$(`#${ids.relationCount}`).textContent=`${rs.length} 条`;
      const focus=$(`#${ids.focus}`);
      if(activeEdge[module]){
        const [a,b,l]=activeEdge[module],source=sourceForEdge(module,a,b),verified=edgeIsConfirmed(module,a,b);
        focus.hidden=false;focus.innerHTML=`<strong>${esc(maps[module][a].label)}</strong> — ${esc(l)} → <strong>${esc(maps[module][b].label)}</strong><span class="relation-source">${verified?"已由附件确认：":"关系状态："}${esc(source)}</span>`;
      }else{focus.hidden=true;focus.innerHTML=""}
      $(`#${ids.relations}`).innerHTML=rs.map(([a,b,l])=>{
        const target=a===id?maps[module][b]:maps[module][a],verified=edgeIsConfirmed(module,a,b);
        return `<button class="relation" type="button" data-edge-ref="${relationRef(module,a,b)}"><small>${esc(l)}</small><strong>${esc(target.label)}</strong><span class="${verified?"verified":""}">${verified?"已确认":"查看 ›"}</span></button>`;
      }).join("");
    }
    function selectNode(module,id,options={}){
      if(!maps[module][id])return;selected[module]=id;activeEdge[module]=null;ensureFilterForNode(module,id);detail(module,id);renderGraph(module);
      if(options.center!==false)centerOn(module,id);
    }
    function selectEdge(module,a,b,label){
      activeEdge[module]=[a,b,label];selected[module]=a;ensureFilterForNode(module,a);ensureFilterForNode(module,b);detail(module,a);renderGraph(module);centerOn(module,a);
      toastMsg(`已选中关系：${maps[module][a].label} — ${label} → ${maps[module][b].label}`);
    }
    function selectRelationRef(ref){
      const [module,a,b]=ref.split("|"),edge=graphEdges(module).find(([x,y])=>x===a&&y===b||x===b&&y===a);
      if(edge)selectEdge(module,edge[0],edge[1],edge[2]);
    }
    function startNodeDrag(event,module,id){
      if(event.button!==0)return;event.stopPropagation();
      const svgRoot=$(`#strainSvg`),rect=svgRoot.getBoundingClientRect(),state=graphState[module],node=maps[module][id],start={x:event.clientX,y:event.clientY,nodeX:node.x,nodeY:node.y},toSvg=(x,y)=>({x:(x-rect.left)/rect.width*900,y:(y-rect.top)/rect.height*590});
      state.drag={id,start,toSvg,moved:false};svgRoot.setPointerCapture(event.pointerId);
      const move=ev=>{if(!state.drag)return;const p=toSvg(ev.clientX,ev.clientY),origin=toSvg(start.x,start.y),dx=(p.x-origin.x)/state.zoom,dy=(p.y-origin.y)/state.zoom;if(Math.abs(dx)+Math.abs(dy)>2)state.drag.moved=true;node.x=start.nodeX+dx;node.y=start.nodeY+dy;renderGraph(module)};
      const up=ev=>{const moved=state.drag&&state.drag.moved;state.drag=null;if(moved)graphState[module].lastDragged=id;try{svgRoot.releasePointerCapture(ev.pointerId)}catch{}svgRoot.removeEventListener("pointermove",move);svgRoot.removeEventListener("pointerup",up);svgRoot.removeEventListener("pointercancel",up)};
      svgRoot.addEventListener("pointermove",move);svgRoot.addEventListener("pointerup",up);svgRoot.addEventListener("pointercancel",up);
    }
    function setupCanvas(module){
      const svgRoot=$(`#strainSvg`),state=graphState[module];
      svgRoot.addEventListener("pointerdown",event=>{
        if(event.target.closest(".node,.edge-hit,.edge-label-group"))return;
        const start={x:event.clientX,y:event.clientY,panX:state.panX,panY:state.panY},rect=svgRoot.getBoundingClientRect();svgRoot.setPointerCapture(event.pointerId);
        const move=ev=>{state.panX=start.panX+(ev.clientX-start.x)*900/rect.width;state.panY=start.panY+(ev.clientY-start.y)*590/rect.height;renderGraph(module)};
        const up=ev=>{try{svgRoot.releasePointerCapture(ev.pointerId)}catch{}svgRoot.removeEventListener("pointermove",move);svgRoot.removeEventListener("pointerup",up);svgRoot.removeEventListener("pointercancel",up)};
        svgRoot.addEventListener("pointermove",move);svgRoot.addEventListener("pointerup",up);svgRoot.addEventListener("pointercancel",up);
      });
      svgRoot.addEventListener("wheel",event=>{event.preventDefault();state.zoom=Math.max(.65,Math.min(1.8,state.zoom+(event.deltaY<0?.1:-.1)));renderGraph(module)},{passive:false});
    }
    function setDepth(module,value){graphState[module].depth=Number(value);renderGraph(module);toastMsg(`已展开 ${value} 跳关系`)}
    function zoomGraph(module,direction){graphState[module].zoom=Math.max(.65,Math.min(1.8,graphState[module].zoom+(direction==="in"?.1:-.1)));renderGraph(module)}
    function resetView(module){
      graphNodes(module).forEach(n=>{const p=initialPositions[module][n.id];n.x=p.x;n.y=p.y});
      graphState[module].zoom=1;graphState[module].panX=0;graphState[module].panY=0;graphState[module].depth=2;activeEdge[module]=null;selectNode(module,module==="strain"?"strain":"product",{center:false});toastMsg("已重置当前图谱视图");
    }
    function expandDetail(module){const next=graphState[module].depth>=3?1:Math.min(3,graphState[module].depth+1);graphState[module].depth=next;$(`#${module}Depth`).value=String(next);renderGraph(module);toastMsg(`已切换为 ${next} 跳关系`)}

    function toastMsg(m){ if (typeof showToast === "function") showToast(m); }

    function initKg(module="strain"){
      const root=document.getElementById("kgRoot");
      if(!root) return;
      setupCanvasChrome("strain");setupCanvas("strain");
      $("#strainDepth").addEventListener("change",event=>setDepth("strain",event.target.value));
      $$("[data-zoom]").forEach(button=>button.addEventListener("click",()=>zoomGraph(button.closest("[data-kg-zoom-control]").dataset.kgZoomControl,button.dataset.zoom)));
      $$(".filter-button").forEach(button=>button.addEventListener("click",()=>{button.classList.toggle("active");const m=button.closest(".module").dataset.kgView;requestAnimationFrame(()=>renderGraph(m))}));
