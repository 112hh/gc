      $("#resetGraph").addEventListener("click",()=>resetView("strain"));
      $$("[data-kg-action='focus']").forEach(button=>button.addEventListener("click",()=>selectNode("strain","strain")));
      $("#strainSelect").addEventListener("change",e=>{const id=e.target.value==="yeast"?"strain":e.target.value==="ecoli"?"genome":e.target.value==="pichia"?"omics":"gpa";selectNode("strain",id);toastMsg(`已切换中心对象：${e.target.options[e.target.selectedIndex].text}`)});
      detail("strain","strain");renderGraph("strain");
    }

    function renderKgPage(){
      return '<div class="kg-scope kg-page" id="kgRoot">' + KG_HTML + '</div>';
    }

    const KG_HTML = "<section class=\"page-head\"><div><div class=\"eyebrow\">KNOWLEDGE GRAPH EXPLORER</div><h1 id=\"pageTitle\">菌株知识图谱</h1><p id=\"pageDesc\">以菌株为中心，展示基因、多组学、发酵、培养、表型、算法与专利等实体和数据集的关联关系。</p></div><div class=\"head-actions\"><button class=\"btn\" type=\"button\" id=\"resetGraph\">↺ 重置视图</button><button class=\"btn primary\" type=\"button\" id=\"snapshot\">⇩ 导出图谱</button></div></section>\n<section class=\"module active\" data-kg-view=\"strain\">\n          <div class=\"module-toolbar\"><span class=\"toolbar-title\">中心实体：菌株</span><label><span class=\"sr-only\">选择菌株</span><select class=\"select\" id=\"strainSelect\"><option value=\"yeast\">酿酒酵母 S288C</option><option value=\"ecoli\">大肠杆菌 K-12</option><option value=\"pichia\">毕赤酵母 GS115</option><option value=\"coryne\">谷氨酸棒状杆菌 ATCC 13032</option></select></label><label><span class=\"sr-only\">选择关系深度</span><select class=\"select\" id=\"strainDepth\"><option value=\"2\">展开 2 跳关系</option><option value=\"1\">展开 1 跳关系</option><option value=\"3\">展开 3 跳关系</option></select></label><div class=\"toolbar-spacer\"></div><div class=\"zoom-controls\" data-kg-zoom-control=\"strain\"><button class=\"zoom-button\" type=\"button\" data-zoom=\"out\" aria-label=\"缩小\">−</button><span class=\"zoom-level\">100%</span><button class=\"zoom-button\" type=\"button\" data-zoom=\"in\" aria-label=\"放大\">＋</button></div><button class=\"btn\" type=\"button\" data-kg-action=\"focus\">聚焦中心实体</button></div>\n          <div class=\"graph-layout\">\n            <aside class=\"side-panel\"><h3>关联关系筛选</h3><small>控制从中心菌株向外展开的知识类型</small><div class=\"filter-section\"><strong>数据与实验</strong><button class=\"filter-button active\" type=\"button\" data-kg-filter=\"genome\"><i class=\"filter-dot blue\"></i>基因组 / 突变数据</button><button class=\"filter-button active\" type=\"button\" data-kg-filter=\"omics\"><i class=\"filter-dot teal\"></i>多组学数据集</button><button class=\"filter-button active\" type=\"button\" data-kg-filter=\"fermentation\"><i class=\"filter-dot amber\"></i>发酵过程数据</button><button class=\"filter-button active\" type=\"button\" data-kg-filter=\"medium\"><i class=\"filter-dot teal\"></i>培养条件数据</button></div><div class=\"filter-section\"><strong>分析与知识</strong><button class=\"filter-button active\" type=\"button\" data-kg-filter=\"analysis\"><i class=\"filter-dot violet\"></i>GPA / GWAS分析</button><button class=\"filter-button active\" type=\"button\" data-kg-filter=\"phenotype\"><i class=\"filter-dot coral\"></i>表型与产物</button><button class=\"filter-button active\" type=\"button\" data-kg-filter=\"patent\"><i class=\"filter-dot amber\"></i>专利与技术路线</button></div></aside>\n            <div class=\"canvas\" data-kg-canvas=\"strain\"><div class=\"canvas-head\"><strong>菌株全链路关联网络</strong><small id=\"strainCount\">中心 1 · 关联 12</small></div><svg id=\"strainSvg\" viewBox=\"0 0 900 590\" role=\"img\" aria-label=\"以酿酒酵母为中心的菌株知识图谱\"><defs><marker id=\"arrow\" markerWidth=\"7\" markerHeight=\"7\" refX=\"6\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L7,3.5 L0,7z\" fill=\"#b4c5cd\"></path></marker><marker id=\"arrowHot\" markerWidth=\"7\" markerHeight=\"7\" refX=\"6\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L7,3.5 L0,7z\" fill=\"#4d91af\"></path></marker></defs><g id=\"strainWorld\"><g id=\"strainEdges\"></g><g id=\"strainNodes\"></g></g></svg><div class=\"legend\"><span class=\"legend-item\"><i class=\"blue\"></i>菌株 / 基因</span><span class=\"legend-item\"><i class=\"teal\"></i>数据集</span><span class=\"legend-item\"><i class=\"violet\"></i>分析模型</span><span class=\"legend-item\"><i class=\"amber\"></i>专利 / 工艺</span><span class=\"legend-item\"><i class=\"coral\"></i>表型 / 产物</span></div></div>\n            <aside class=\"detail-panel\"><div class=\"detail-head\"><div><small>当前选中实体</small><h2 id=\"strainDetailTitle\">酿酒酵母 S288C</h2></div><button class=\"close\" id=\"clearSelection\" type=\"button\" aria-label=\"清除选择\">×</button></div><div class=\"detail-body\"><div class=\"type-line\"><span class=\"type-badge\" id=\"detailType\">菌株实体</span><span class=\"status\">已纳入图谱</span></div><p class=\"detail-desc\" id=\"detailDesc\">经典模式工程细胞，关联乙醇生产、代谢工程、发酵过程和多组学数据。</p><div class=\"section-title\"><span>实体属性</span><small>Entity properties</small></div><dl class=\"props\" id=\"detailProps\"></dl><div class=\"section-title\"><span>关联数据域</span><small id=\"detailTagsCount\">5 类</small></div><div class=\"tag-list\" id=\"detailTags\"></div><div class=\"section-title\"><span>关系与证据</span><small id=\"detailRelationCount\">12 条</small></div><div class=\"relation-focus\" id=\"detailRelationFocus\" hidden></div><div id=\"detailRelations\"></div><div class=\"section-title\"><span>数据来源</span><small>Traceability</small></div><div class=\"evidence\"><strong id=\"detailSource\">工程细胞主题库 · 菌株标准数据</strong><small>关联基因组、发酵批次、培养条件及人工审核记录。</small></div></div><div class=\"detail-actions\"><button class=\"detail-button\" type=\"button\" id=\"expandDetail\">展开关系</button><button class=\"detail-button primary\" type=\"button\" id=\"traceDetail\">查看溯源</button></div></aside>\n          </div>\n        </section>";

    return { render: renderKgPage, init: initKg };
    })();

</script>

  <script>
    /* 登录入口 index.html 以 ./app.html?auth=login 跳转至此：记录登录态并提示 */
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        if (params.get("auth") === "login") {
          try { window.sessionStorage.setItem("engineering-cell-auth", "logged-in"); } catch (e) {}
          if (window.history && window.history.replaceState) {
            window.history.replaceState(null, "", window.location.pathname);
          }
          var tip = "登录成功，欢迎回来";
          if (typeof showToast === "function") {
            showToast(tip);
          } else {
            var el = document.getElementById("toast");
            if (el) {
              el.textContent = tip;
              el.classList.add("show");
              window.setTimeout(function () { el.classList.remove("show"); }, 2200);

          }

      } catch (e) {}
