<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工程细胞数据标准体系</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif; background:#F5F7FA; color:#262626; }
:root { --primary:#1677FF; --primary-light:#E6F4FF; --primary-dark:#0958D9; --border:#E8E8E8; --muted:#595959; --bg:#F5F7FA; --divider:#F0F0F0; --success:#52C41A; --warning:#FAAD14; --danger:#FF4D4F; --shadow-1:0 2px 8px 0 rgba(0,0,0,.05); --shadow-2:0 4px 16px 0 rgba(0,0,0,.08); }
/* layout */
.app { display:flex; min-height:100vh; }
.sidebar { width:260px; background:#fff; border-right:1px solid var(--border); flex-shrink:0; position:fixed; top:0; bottom:0; left:0; z-index:100; overflow-y:auto; transition:width .3s; }
.sidebar.collapsed { width:64px; }
.sidebar-header { padding:16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
.logo { width:36px; height:36px; border-radius:8px; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; }
.sidebar-title { font-size:14px; font-weight:600; color:#1E293B; white-space:nowrap; overflow:hidden; }
.sidebar-subtitle { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; }
.sidebar.collapsed .sidebar-title, .sidebar.collapsed .sidebar-subtitle { display:none; }
.sidebar.collapsed .sidebar-header { justify-content:center; }
.menu { padding:8px; }
.menu-item { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:8px; cursor:pointer; font-size:14px; color:#1E293B; transition:all .15s; text-decoration:none; margin-bottom:2px; }
.menu-item:hover { background:var(--primary-light); color:var(--primary); }
.menu-item.active { background:var(--primary); color:#fff; }
.menu-item .icon { width:18px; height:18px; flex-shrink:0; }
.menu-item .text { white-space:nowrap; overflow:hidden; }
.sidebar.collapsed .menu-item .text { display:none; }
.sidebar.collapsed .menu-item { justify-content:center; }
.menu-sub { padding-left:28px; }
.menu-sub .menu-item { font-size:13px; padding:6px 12px; color:var(--muted); }
.menu-sub .menu-item:hover { color:var(--primary); }
.menu-arrow { margin-left:auto; transition:transform .2s; }
.menu-arrow.open { transform:rotate(0deg); }
.menu-arrow.closed { transform:rotate(-90deg); }
.sidebar.collapsed .menu-arrow, .sidebar.collapsed .menu-sub { display:none; }
/* main */
.main { flex:1; margin-left:260px; transition:margin-left .3s; }
.sidebar.collapsed ~ .main { margin-left:64px; }
.header { position:sticky; top:0; z-index:50; background:rgba(255,255,255,.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--border); height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 24px; }
.header-left { display:flex; align-items:center; gap:12px; }
.toggle-btn { width:32px; height:32px; border:none; background:none; cursor:pointer; border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--muted); }
.toggle-btn:hover { background:var(--bg); color:var(--primary); }
.search-box { position:relative; }
.search-box input { width:240px; height:36px; padding:0 12px 0 36px; border:1px solid var(--border); border-radius:8px; background:var(--bg); font-size:14px; outline:none; }
.search-box input:focus { border-color:var(--primary); }
.search-box svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); }
.header-right { display:flex; align-items:center; gap:8px; }
.header-btn { width:32px; height:32px; border:none; background:none; cursor:pointer; border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--muted); }
.header-btn:hover { background:var(--bg); color:var(--primary); }
.content { padding:24px; }
/* overview */
.banner { border-radius:16px; background:linear-gradient(135deg,#2563EB,#3B82F6,#60A5FA); padding:32px 40px; color:#fff; position:relative; overflow:hidden; margin-bottom:24px; }
.banner::before { content:''; position:absolute; top:0; right:0; width:300px; height:300px; background:rgba(255,255,255,.1); border-radius:50%; transform:translate(30%,-50%); }
.banner::after { content:''; position:absolute; bottom:0; left:33%; width:180px; height:180px; background:rgba(255,255,255,.05); border-radius:50%; transform:translateY(50%); }
.banner-content { position:relative; z-index:1; max-width:600px; }
.banner-badge { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:20px; background:rgba(255,255,255,.2); font-size:12px; font-weight:500; margin-bottom:16px; }
.banner h1 { font-size:28px; font-weight:700; margin-bottom:8px; }
.banner p { font-size:14px; opacity:.85; line-height:1.6; }
.banner-btn { display:inline-flex; align-items:center; gap:6px; margin-top:20px; padding:8px 16px; border-radius:8px; background:#fff; color:var(--primary); border:none; cursor:pointer; font-size:14px; font-weight:500; }
.banner-btn:hover { background:rgba(255,255,255,.9); }
/* KPI */
.kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
.kpi-card { background:#fff; border:1px solid var(--border); border-radius:12px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.04); transition:box-shadow .2s; }
.kpi-card:hover { box-shadow:0 4px 12px rgba(0,0,0,.08); }
.kpi-card .top { display:flex; justify-content:space-between; align-items:flex-start; }
.kpi-label { font-size:13px; color:var(--muted); margin-bottom:4px; }
.kpi-value { font-size:32px; font-weight:700; color:#1E293B; }
.kpi-icon { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; }
/* module cards */
.section-title { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.section-title h2 { font-size:18px; font-weight:600; }
.section-title span { font-size:14px; color:var(--muted); }
.module-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:20px; }
.module-card { background:#fff; border:1px solid var(--border); border-radius:12px; padding:24px; cursor:pointer; transition:all .2s; }
.module-card:hover { border-color:rgba(37,99,235,.3); box-shadow:0 4px 16px rgba(0,0,0,.06); transform:translateY(-2px); }
.module-card .header-row { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; }
.module-icon { width:44px; height:44px; border-radius:12px; background:var(--primary-light); color:var(--primary); display:flex; align-items:center; justify-content:center; transition:all .2s; }
.module-card:hover .module-icon { background:var(--primary); color:#fff; }
.module-card h3 { font-size:16px; font-weight:600; }
.module-card .meta { font-size:12px; color:var(--muted); margin-top:4px; }
.module-card .desc { font-size:14px; color:var(--muted); line-height:1.6; margin-bottom:16px; }
.tag-row { display:flex; flex-wrap:wrap; gap:8px; }
.tag { display:inline-flex; padding:4px 10px; border-radius:6px; background:var(--bg); font-size:12px; color:var(--muted); border:1px solid var(--border); }
/* breadcrumb */
.breadcrumb { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin-bottom:8px; }
.breadcrumb .current { color:#1E293B; }
.module-title h1 { font-size:22px; font-weight:700; margin-bottom:4px; }
.module-title p { font-size:14px; color:var(--muted); }
/* toolbar */
.toolbar { background:#fff; border:1px solid var(--border); border-radius:12px; padding:16px; margin:20px 0; display:flex; gap:12px; align-items:center; flex-wrap:wrap; justify-content:space-between; }
.toolbar-left { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.toolbar input, .toolbar select { height:36px; border:1px solid var(--border); border-radius:8px; background:var(--bg); font-size:14px; padding:0 12px; outline:none; }
.toolbar input { padding-left:36px; width:220px; }
.toolbar input:focus, .toolbar select:focus { border-color:var(--primary); }
.search-wrap { position:relative; }
.search-wrap svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); }
.toolbar-right { display:flex; gap:8px; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:8px; font-size:14px; cursor:pointer; border:none; transition:all .15s; }
.btn-outline { background:#fff; border:1px solid var(--border); color:var(--muted); }
.btn-outline:hover { color:var(--primary); border-color:rgba(37,99,235,.3); }
.btn-primary { background:var(--primary); color:#fff; }
.btn-primary:hover { background:var(--primary-dark); }
/* table */
.table-card { background:#fff; border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.table-header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.table-header h3 { font-size:16px; font-weight:600; }
.table-header .count { font-size:14px; color:var(--muted); margin-left:8px; font-weight:400; }
.module-tabs { display:flex; align-items:stretch; border-bottom:1px solid var(--border); background:#fff; }
.module-tab { flex:1; min-height:54px; padding:14px 18px; border:none; border-bottom:2px solid transparent; background:#fff; cursor:pointer; color:#1E293B; font-size:15px; font-weight:500; text-align:center; }
.module-tab:hover { background:var(--bg); color:var(--primary); }
.module-tab.active { color:var(--primary); border-bottom-color:var(--primary); font-weight:700; }
table { width:100%; border-collapse:collapse; }
.gpa-table { table-layout:fixed; }
.gpa-table col.name-col { width:15%; }
.gpa-table col.desc-col { width:27%; }
.gpa-table col.elements-col { width:34%; }
.gpa-table col.status-col { width:9%; }
.gpa-table col.action-col { width:15%; }
th { background:var(--bg); padding:12px 16px; text-align:left; font-size:13px; font-weight:500; color:var(--muted); white-space:nowrap; }
td { padding:12px 16px; font-size:14px; border-top:1px solid var(--border); vertical-align:middle; }
tr { cursor:pointer; transition:background .15s; }
tr:hover { background:rgba(247,249,252,.5); }
.badge { display:inline-flex; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:500; border:1px solid; }
.badge-draft { background:var(--bg); color:var(--muted); border-color:var(--border); }
.badge-reviewing { background:#FFF7ED; color:#C2410C; border-color:#FED7AA; }
.badge-published { background:#F0FDF4; color:#15803D; border-color:#BBF7D0; }
.desc-cell { max-width:280px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; color:var(--muted); font-size:13px; }
.elements-cell { display:flex; flex-wrap:wrap; gap:6px; }
.element-chip { display:inline-flex; align-items:center; gap:4px; padding:4px 8px; border-radius:6px; background:var(--bg); border:1px solid var(--border); color:var(--muted); font-size:12px; line-height:1.4; }
.element-chip strong { color:#1E293B; font-weight:500; }
.view-btn { background:none; border:none; color:var(--primary); cursor:pointer; font-size:14px; display:inline-flex; align-items:center; gap:4px; }
.view-btn:hover { color:var(--primary-dark); }
.action-cell { width:220px; text-align:left; white-space:nowrap; }
.action-group { display:inline-flex; align-items:center; justify-content:flex-start; gap:8px; vertical-align:middle; }
.action-group .view-btn { padding:4px 0; line-height:1; }
.action-group .view-btn svg { width:16px; height:16px; }
.empty-row td { text-align:center; padding:48px; color:var(--muted); }
/* detail drawer */
.drawer-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:200; opacity:0; pointer-events:none; transition:opacity .3s; }
.drawer-overlay.open { opacity:1; pointer-events:auto; }
.drawer { position:fixed; top:0; right:0; bottom:0; width:480px; max-width:100vw; background:#fff; z-index:201; transform:translateX(100%); transition:transform .3s; overflow-y:auto; box-shadow:-4px 0 24px rgba(0,0,0,.1); }
.drawer.open { transform:translateX(0); }
.drawer-header { padding:20px 24px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-start; }
.drawer-header h2 { font-size:18px; font-weight:600; }
.drawer-header .code { font-size:14px; color:var(--muted); margin-top:4px; }
.drawer-close { width:32px; height:32px; border:none; background:none; cursor:pointer; border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--muted); }
.drawer-close:hover { background:var(--bg); }
.drawer-body { padding:20px 24px; }
.detail-section { margin-bottom:24px; }
.detail-section h3 { font-size:14px; font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
.detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.detail-item .label { font-size:13px; color:var(--muted); margin-bottom:4px; }
.detail-item .value { font-size:14px; color:#1E293B; }
.divider { border-top:1px solid var(--border); margin:20px 0; }
.desc-text { font-size:14px; color:var(--muted); line-height:1.6; }
/* element table */
.element-table { width:100%; border-collapse:collapse; border-radius:8px; overflow:hidden; border:1px solid var(--border); }
.element-table td { padding:12px 16px; font-size:14px; border-top:1px solid var(--border); cursor:default; }
.element-table tr:first-child td { border-top:none; }
.element-table td:first-child { background:var(--bg); width:40%; font-weight:500; color:var(--muted); }
.element-table td:last-child { color:#1E293B; }
/* timeline */
.timeline { display:flex; flex-direction:column; gap:10px; }
.timeline::before { display:none; }
.timeline-item { display:grid; grid-template-columns:12px 1fr; gap:10px; align-items:start; padding:12px; border:1px solid var(--border); border-radius:8px; background:var(--bg); margin-bottom:0; }
.timeline-dot { position:static; width:10px; height:10px; border-radius:50%; border:none; margin-top:5px; }
.timeline-dot.draft { background:#94A3B8; }
.timeline-dot.reviewing { background:#F97316; }
.timeline-dot.published { background:#22C55E; }
.timeline-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.timeline-status { font-size:14px; font-weight:600; color:#1E293B; }
.timeline-time { font-size:12px; color:var(--muted); margin-left:8px; }
.timeline-meta { font-size:12px; color:var(--muted); margin-top:2px; }
/* comments */
.comment-card { padding:14px; border:1px solid var(--border); border-radius:8px; margin-bottom:12px; background:var(--bg); }
.comment-header { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.comment-name { font-size:14px; font-weight:500; }
.comment-time { font-size:12px; color:var(--muted); margin-left:auto; }
.comment-result { display:inline-flex; padding:3px 8px; border-radius:6px; font-size:12px; font-weight:500; }
.comment-result.approve { color:#15803D; background:#F0FDF4; border:1px solid #BBF7D0; }
.comment-result.reject { color:#B91C1C; background:#FEF2F2; border:1px solid #FECACA; }
.comment-text { font-size:14px; color:var(--muted); line-height:1.6; }
.empty-box { text-align:center; padding:24px; font-size:14px; color:var(--muted); background:var(--bg); border:1px dashed var(--border); border-radius:8px; }
/* modal */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:300; opacity:0; pointer-events:none; transition:opacity .3s; display:flex; align-items:center; justify-content:center; }
.modal-overlay.open { opacity:1; pointer-events:auto; }
.modal { background:#fff; border-radius:12px; width:640px; max-width:92vw; max-height:90vh; overflow-y:auto; transform:scale(.95); transition:transform .3s; }
.modal-overlay.open .modal { transform:scale(1); }
.modal-header { padding:20px 24px; border-bottom:1px solid var(--border); }
.modal-header h2 { font-size:18px; font-weight:600; }
.modal-body { padding:24px; }
.form-group { margin-bottom:16px; }
.form-group label { display:block; font-size:14px; font-weight:500; margin-bottom:6px; }
.form-group label .req { color:#EF4444; }
.form-group input, .form-group select, .form-group textarea { width:100%; height:38px; border:1px solid var(--border); border-radius:8px; padding:0 12px; font-size:14px; outline:none; background:#fff; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--primary); }
.form-group textarea { height:auto; padding:10px 12px; resize:vertical; }
.form-row { display:flex; gap:16px; }
.form-row .form-group { flex:1; }
.upload-box { border:1px dashed #CBD5E1; border-radius:8px; background:var(--bg); padding:18px; }
.upload-box input { background:#fff; }
.upload-note { margin-top:12px; padding:12px; border-radius:8px; background:#EFF6FF; color:#475569; font-size:13px; line-height:1.7; }
.upload-note strong { color:#1E293B; }
.modal-footer { padding:16px 24px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; }
/* toast */
.toast { position:fixed; top:20px; right:20px; background:#1E293B; color:#fff; padding:12px 20px; border-radius:8px; font-size:14px; z-index:400; transform:translateX(120%); transition:transform .3s; }
.toast.show { transform:translateX(0); }
/* svg icons */
svg { display:inline-block; vertical-align:middle; }
/* responsive */
@media (max-width:768px) {
  .kpi-grid { grid-template-columns:repeat(2,1fr); }
  .module-grid { grid-template-columns:1fr; }
  .sidebar { width:64px; }
  .sidebar .sidebar-title, .sidebar .sidebar-subtitle, .sidebar .menu-item .text, .sidebar .menu-arrow, .sidebar .menu-sub { display:none; }
  .sidebar .menu-item { justify-content:center; }
  .sidebar .sidebar-header { justify-content:center; }
  .main { margin-left:64px; }
  .detail-grid { grid-template-columns:1fr; }
  .drawer { width:100vw; }
}
body.embedded { background:#F7F9FC; overflow:hidden; }
body.embedded .app { display:block; min-height:100vh; }
body.embedded .sidebar,
body.embedded .header { display:none; }
body.embedded .main { margin-left:0; min-height:100vh; }
body.embedded .content { padding:32px; }
body.embedded .toolbar { margin-top:24px; }

/* 2026-07 UI spec normalization for embedded standards page. */
.sidebar { width:220px; background:linear-gradient(180deg,#DCEEFF 0%,#CFE5FF 42%,#EDF6FF 100%); color:#595959; border-right:1px solid rgba(22,119,255,.12); }
.main { margin-left:220px; }
.sidebar.collapsed ~ .main { margin-left:64px; }
.sidebar-header { height:56px; padding:0 16px; border-bottom:1px solid rgba(22,119,255,.12); }
.logo { width:32px; height:32px; border-radius:50%; background:#fff; color:var(--primary); box-shadow:var(--shadow-1); }
.sidebar-title { color:#1A1A2E; }
.sidebar-subtitle { color:#8C8C8C; }
.menu-item { border-radius:4px; color:#595959; min-height:36px; }
.menu-item:hover { background:#fff; color:var(--primary); }
.menu-item.active { background:#fff; color:var(--primary); box-shadow:var(--shadow-1); }
.menu-sub .menu-item { color:#666; }
.header { height:56px; background:linear-gradient(90deg,rgba(226,241,255,.96),rgba(255,255,255,.94)); border-bottom-color:var(--divider); backdrop-filter:none; }
.content { padding:24px; }
.banner { border-radius:8px; background:linear-gradient(135deg,#7AB8FF,#1677FF); padding:24px; margin-bottom:16px; box-shadow:var(--shadow-1); }
.banner h1 { font-size:20px; line-height:1.4; }
.kpi-grid, .module-grid { gap:16px; }
.kpi-card, .module-card, .toolbar, .table-card, .modal, .drawer, .comment-card, .timeline-item, .element-table, .empty-box, .upload-box { border-color:var(--border); border-radius:8px; box-shadow:var(--shadow-1); background:#fff; }
.module-card:hover { border-color:#91CAFF; box-shadow:var(--shadow-2); transform:translateY(-2px); }
.module-icon, .kpi-icon { border-radius:50%; background:var(--primary-light); color:var(--primary); }
.toolbar input, .toolbar select, .search-box input, .form-group input, .form-group select, .form-group textarea { height:32px; border-color:#D9D9D9; border-radius:4px; background:#fff; }
.toolbar input:focus, .toolbar select:focus, .search-box input:focus, .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--primary); box-shadow:0 0 0 2px rgba(22,119,255,.2); }
.btn { min-height:32px; padding:0 14px; border-radius:4px; font-weight:500; }
.btn-primary { background:var(--primary); }
.btn-primary:hover { background:#4096FF; }
.btn-outline { color:#595959; border-color:#D9D9D9; }
.btn-outline:hover { border-color:#4096FF; color:var(--primary); }
th { height:40px; padding:10px 16px; background:#F5F5F5; color:#262626; font-weight:500; }
td { height:44px; padding:10px 16px; border-top-color:var(--border); color:#595959; }
tr:hover { background:#FAFAFA; }
.badge { border-radius:999px; font-weight:400; }
.badge-published, .comment-result.approve { background:#F6FFED; color:var(--success); border-color:#B7EB8F; }
.badge-reviewing { background:#FFFBE6; color:var(--warning); border-color:#FFE58F; }
.drawer-overlay, .modal-overlay { background:rgba(0,0,0,.45); }
.drawer { width:500px; box-shadow:-12px 0 32px rgba(0,0,0,.12); border-radius:0; }
.modal { border-radius:6px; box-shadow:0 4px 8px 2px rgba(0,0,0,.08),0 8px 16px 2px rgba(0,0,0,.1),0 16px 32px 2px rgba(0,0,0,.1); }
.modal-header, .drawer-header, .modal-footer { border-color:var(--divider); }
body.embedded { background:#F5F7FA; }
body.embedded .content { padding:24px; }
@media (max-width:768px) { .main { margin-left:64px; } }
</style>
</head>
<body>

    }
    const subs = m.subModules.map(s => 
      `<div class="menu-sub"><div class="menu-item" onclick="navigate('module','${m.id}','${s.id}')" id="nav-${m.id}-${s.id}">
        <span class="text">${s.name}</span>
      </div></div>`
    ).join('');
    html += `<div class="menu-item" onclick="toggleModule('${m.id}')" id="nav-${m.id}">
      ${ICONS[m.icon]}<span class="text">${m.name}</span>
      <span class="menu-arrow ${openModules[m.id]?'open':'closed'}">${ICONS.chevronDown}</span>
    </div>
    <div class="menu-sub" id="subs-${m.id}" style="${openModules[m.id]?'':'display:none'}">${subs}</div>`;
  });
  menu.innerHTML = html;
}

function toggleModule(id) {
  openModules[id] = !openModules[id];
  const subs = document.getElementById('subs-'+id);
  const arrow = document.querySelector('#nav-'+id+' .menu-arrow');
  if (subs) subs.style.display = openModules[id] ? '' : 'none';
  if (arrow) { arrow.className = 'menu-arrow ' + (openModules[id]?'open':'closed'); }
  navigate('module', id);
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  sb.classList.toggle('collapsed');
}

function navigate(type, moduleId, subId) {
  if (type === 'overview') {
    navigate('module','gpa');
    return;
  } else {
    currentModuleId = moduleId;
    currentSubFilter = subId || 'all';
    renderModulePage(moduleId);
  }
  // update active
  document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
  if (type !== 'overview') {
    if (subId) {
      document.getElementById('nav-'+moduleId+'-'+subId)?.classList.add('active');
    }
    document.getElementById('nav-'+moduleId)?.classList.add('active');
  }
}

function renderOverview() {
  const kpis = [
    {label:'标准总数', value:STATS.totalStandards, icon:ICONS.bookOpen, color:'var(--primary)', bg:'var(--primary-light)'},
    {label:'已发布标准', value:STATS.publishedCount, icon:ICONS.check, color:'#15803D', bg:'#F0FDF4'},
    {label:'审核中标准', value:STATS.reviewingCount, icon:ICONS.clock, color:'#C2410C', bg:'#FFF7ED'},
    {label:'已创建标准', value:STATS.draftCount, icon:ICONS.edit, color:'var(--muted)', bg:'var(--bg)'}
  ];
  const kpiHtml = kpis.map(k => 
    `<div class="kpi-card"><div class="top"><div><div class="kpi-label">${k.label}</div><div class="kpi-value">${k.value}</div></div><div class="kpi-icon" style="background:${k.bg};color:${k.color}">${k.icon}</div></div></div>`
  ).join('');

  const moduleHtml = MODULES.map(m => {
    const count = STANDARDS.filter(s => s.moduleId === m.id).length;
    const tags = m.subModules.map(s => `<span class="tag">${s.name}</span>`).join('');
    return `<div class="module-card" onclick="navigate('module','${m.id}')">
      <div class="header-row">
        <div style="display:flex;gap:12px;align-items:flex-start">
          <div class="module-icon">${ICONS[m.icon]}</div>
          <div>
            <h3>${m.name}</h3>
            <div class="meta">${m.subModules.length} 个子功能 · ${count} 项标准</div>
          </div>
        </div>
        <span style="color:var(--muted)">${ICONS.arrow}</span>
      </div>
      <div class="desc">${m.description}</div>
      <div class="tag-row">${tags}</div>
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="banner">
      <div class="banner-content">
        <div class="banner-badge">${ICONS.shield} 工程细胞数据标准管理平台</div>
        <h1>工程细胞数据标准体系</h1>
        <p>制定全流程全量数据标准，实现各类数据归一化管理</p>
        <button class="banner-btn" onclick="navigate('module','gpa')">查看全部标准 ${ICONS.arrow}</button>
      </div>
    </div>
    <div class="kpi-grid">${kpiHtml}</div>
    <div>
      <div class="section-title"><h2>核心模块</h2><span>共 ${MODULES.length} 个模块</span></div>
      <div class="module-grid">${moduleHtml}</div>
    </div>
  `;
}

function renderModulePage(moduleId) {
  const mod = MODULES.find(m => m.id === moduleId);
  if (!mod) return;
  
  let filtered = STANDARDS.filter(s => s.moduleId === moduleId);
  if (currentSubFilter !== 'all') filtered = filtered.filter(s => s.subModuleId === currentSubFilter);
  if (currentStatusFilter !== 'all') filtered = filtered.filter(s => s.status === currentStatusFilter);
  if (currentKeyword) {
    const kw = currentKeyword.toLowerCase();
    filtered = filtered.filter(s => s.name.toLowerCase().includes(kw));
  }

  const isTabbedModule = TABBED_MODULES.includes(moduleId);
  const subOptions = mod.subModules.map(s => `<option value="${s.id}" ${currentSubFilter===s.id?'selected':''}>${s.name}</option>`).join('');
  const subFilterSelect = isTabbedModule ? '' : `<select onchange="onSubFilterChange(this.value)"><option value="all">全部子模块</option>${subOptions}</select>`;

  const renderElements = (s) => {
    const sub = mod.subModules.find(sm => sm.id === s.subModuleId);
    if (!sub || !sub.fields || !sub.fields.length) return '<span style="color:var(--muted)">-</span>';
    return `<div class="elements-cell">${sub.fields.map(f => {
      const val = s.elements && s.elements[f.key] ? s.elements[f.key] : '-';
      return `<span class="element-chip"><strong>${f.label}</strong>${val}</span>`;
    }).join('')}</div>`;
  };

  const renderFlowButton = (s) => {
    if (s.status === 'draft') {
      return `<button class="view-btn" onclick="event.stopPropagation();advanceStandardStatus('${s.id}')">提交审核</button>`;
    }
    if (s.status === 'reviewing') {
      return `<button class="view-btn" onclick="event.stopPropagation();advanceStandardStatus('${s.id}')">确认发布</button>`;
    }
    return '';
  };

  const renderRows = (items) => items.length ? items.map((s,i) => {
    const sub = mod.subModules.find(sm => sm.id === s.subModuleId);
    const st = STATUS_MAP[s.status];
    return `<tr onclick="openDetail('${s.id}')">
      <td style="font-family:monospace;color:var(--muted);white-space:nowrap">${s.code}</td>
      <td style="font-weight:500;white-space:nowrap">${s.name}</td>
      <td style="color:var(--muted);white-space:nowrap">${sub ? sub.name : '-'}</td>
      <td><div class="desc-cell">${s.description}</div></td>
      <td><span class="badge ${st.class}">${st.label}</span></td>
      <td class="action-cell">
        <div class="action-group">
        <button class="view-btn" onclick="event.stopPropagation();openDetail('${s.id}')">${ICONS.eye}查看</button>
        <button class="view-btn" onclick="event.stopPropagation();openEditModal('${s.id}')">编辑</button>
        ${renderFlowButton(s)}
        <button class="view-btn" onclick="event.stopPropagation();deleteStandard('${s.id}')">删除</button>
        </div>
      </td>
    </tr>`;
  }).join('') : `<tr class="empty-row"><td colspan="5">${ICONS.filter}<br><span style="display:inline-block;margin-top:8px">暂无匹配的标准数据</span></td></tr>`;

  const renderTabbedRows = (items) => items.length ? items.map((s,i) => {
    const st = STATUS_MAP[s.status];
    return `<tr onclick="openDetail('${s.id}')">
      <td style="font-weight:500;white-space:nowrap">${s.name}</td>
      <td><div class="desc-cell">${s.description}</div></td>
      <td>${renderElements(s)}</td>
      <td><span class="badge ${st.class}">${st.label}</span></td>
      <td class="action-cell">
        <div class="action-group">
        <button class="view-btn" onclick="event.stopPropagation();openDetail('${s.id}')">${ICONS.eye}查看</button>
        <button class="view-btn" onclick="event.stopPropagation();openEditModal('${s.id}')">编辑</button>
        ${renderFlowButton(s)}
        <button class="view-btn" onclick="event.stopPropagation();deleteStandard('${s.id}')">删除</button>
        </div>
      </td>
    </tr>`;
  }).join('') : `<tr class="empty-row"><td colspan="6">${ICONS.filter}<br><span style="display:inline-block;margin-top:8px">暂无匹配的标准数据</span></td></tr>`;

  const activeSubId = isTabbedModule
    ? (currentSubFilter === 'all' ? mod.subModules[0].id : currentSubFilter)
    : null;
  const visibleRows = isTabbedModule
    ? filtered.filter(s => s.subModuleId === activeSubId)
    : filtered;

  const renderTable = (title, items) => `
    <div class="table-card">
      <div class="table-header"><h3>${title}<span class="count">共 ${items.length} 条</span></h3></div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr>
            <th>功能名称</th><th>所属子模块</th><th>功能描述</th><th>状态</th><th class="action-cell">操作</th>
          </tr></thead>
          <tbody>${renderRows(items)}</tbody>
        </table>
      </div>
    </div>
  `;

  const renderTabbedTable = (sub, items) => `
    <div class="table-header">
      <h3>${sub.name}<span class="count">共 ${items.length} 条</span></h3>
      <div class="toolbar-right">
        <button class="btn btn-outline" onclick="openUploadModal('${moduleId}','${sub.id}')">上传标准文档</button>
        <button class="btn btn-primary" onclick="openNewModal('${moduleId}','${sub.id}')">${ICONS.plus}新建标准</button>
      </div>
    </div>
    <div style="overflow-x:auto">
      <table class="gpa-table">
        <colgroup>
          <col class="name-col">
          <col class="desc-col">
          <col class="elements-col">
          <col class="status-col">
          <col class="action-col">
        </colgroup>
        <thead><tr>
          <th>功能名称</th><th>功能描述</th><th>标准化要素</th><th>状态</th><th class="action-cell">操作</th>
        </tr></thead>
        <tbody>${renderTabbedRows(items)}</tbody>
      </table>
    </div>
  `;

  const tableContent = isTabbedModule
    ? `<div class="table-card">
        <div class="module-tabs">
          ${mod.subModules.map(sub => `<button class="module-tab ${sub.id === activeSubId ? 'active' : ''}" onclick="switchModuleTab('${moduleId}','${sub.id}')">${sub.name}</button>`).join('')}
        </div>
        ${renderTabbedTable(mod.subModules.find(sub => sub.id === activeSubId), visibleRows)}
      </div>`
    : renderTable('标准列表', filtered);

  document.getElementById('content').innerHTML = `
    <div class="breadcrumb"><span>标准管理</span><span>/</span><span class="current">${mod.name}</span></div>
    <div class="module-title"><h1>${mod.name}</h1><p>${mod.description}</p></div>
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="search-wrap">${ICONS.eye.replace('width="16" height="16"','width="16" height="16" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)"')}
        <input type="search" placeholder="搜索标准名称..." value="${currentKeyword}" oninput="onKeywordChange(this.value)"></div>
        ${subFilterSelect}
        <select onchange="onStatusFilterChange(this.value)">
          <option value="all" ${currentStatusFilter==='all'?'selected':''}>全部状态</option>
          <option value="draft" ${currentStatusFilter==='draft'?'selected':''}>已创建</option>
          <option value="reviewing" ${currentStatusFilter==='reviewing'?'selected':''}>审核中</option>
          <option value="published" ${currentStatusFilter==='published'?'selected':''}>已发布</option>
        </select>
      </div>
      <div class="toolbar-right">
        ${isTabbedModule ? '' : `<button class="btn btn-primary" onclick="openNewModal('${moduleId}')">${ICONS.plus}新建标准</button>`}
      </div>
    </div>
    ${tableContent}
  `;
}

function onKeywordChange(v) { currentKeyword = v; renderModulePage(currentModuleId); }
function onSubFilterChange(v) { currentSubFilter = v; renderModulePage(currentModuleId); }
function onStatusFilterChange(v) { currentStatusFilter = v; renderModulePage(currentModuleId); }
function switchModuleTab(moduleId, subId) { currentSubFilter = subId; renderModulePage(moduleId); }

// ===== DETAIL DRAWER =====
function openDetail(id) {
  const std = STANDARDS.find(s => s.id === id);
  if (!std) return;
  const mod = MODULES.find(m => m.id === std.moduleId);
  const sub = mod.subModules.find(s => s.id === std.subModuleId);
  const st = STATUS_MAP[std.status];

  const elementsHtml = sub ? sub.fields.map(f => {
    const val = std.elements[f.key];
    return `<tr><td>${f.label}</td><td>${val !== undefined && val !== '' ? val + (f.unit ? ' ' + f.unit : '') : '<span style="color:#94A3B8">-</span>'}</td></tr>`;
  }).join('') : '';

  const timelineHtml = std.statusHistory.map((item) => {
    return `<div class="timeline-item">
      <div class="timeline-dot ${item.status}"></div>
      <div>
        <div class="timeline-row"><span class="timeline-status">${item.statusLabel}</span><span class="timeline-time">${item.time}</span></div>
        <div class="timeline-meta">操作人：${item.operator}${item.remark ? ' · ' + item.remark : ''}</div>
      </div>
    </div>`;
  }).join('');

  const commentsHtml = std.reviewComments.length ? std.reviewComments.map(c => 
    `<div class="comment-card">
      <div class="comment-header">
        <span class="comment-result ${c.type === 'reject' ? 'reject' : 'approve'}">${c.type === 'reject' ? '驳回' : '通过'}</span>
        <span class="comment-name">${c.reviewer}</span>
        <span class="comment-time">${c.time}</span>
      </div>
      <div class="comment-text">${c.content}</div>
    </div>`
  ).join('') : '<div class="empty-box">暂无确认意见</div>';

  document.getElementById('drawer').innerHTML = `
    <div class="drawer-header">
      <div><h2>${std.name}</h2><div class="code">${sub ? sub.name : '-'} · ${st.label} · ${std.updatedAt}</div></div>
      <button class="drawer-close" onclick="closeDrawer()">${ICONS.x}</button>
    </div>
    <div class="drawer-body">
      <div class="detail-section">
        <h3>${ICONS.fileText} 标准概况</h3>
        <div class="detail-grid">
          <div class="detail-item"><div class="label">当前状态</div><span class="badge ${st.class}">${st.label}</span></div>
          <div class="detail-item"><div class="label">所属子模块</div><div class="value">${sub ? sub.name : '-'}</div></div>
          <div class="detail-item"><div class="label">更新时间</div><div class="value">${std.updatedAt}</div></div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="detail-section"><h3>功能描述</h3><p class="desc-text">${std.description}</p></div>
      <div class="divider"></div>
      <div class="detail-section">
        <h3>标准化要素清单</h3>
        <table class="element-table">${elementsHtml}</table>
      </div>
      <div class="divider"></div>
      <div class="detail-section">
        <h3>${ICONS.clock} 标准流转记录</h3>
        <div class="timeline">${timelineHtml}</div>
      </div>
      <div class="divider"></div>
      <div class="detail-section">
        <h3>${ICONS.message} 确认意见</h3>
        ${commentsHtml}
      </div>
    </div>
  `;
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}

function closeDrawer() {
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

// ===== NEW STANDARD MODAL =====
function openNewModal(moduleId, subId) {
  const mod = MODULES.find(m => m.id === moduleId);
  if (!mod) return;
  const targetSub = subId ? mod.subModules.find(s => s.id === subId) : mod.subModules[0];
  renderStandardModal(moduleId, targetSub.id, null);
  document.getElementById('modalOverlay').classList.add('open');
}

function openEditModal(id) {
  const std = STANDARDS.find(s => s.id === id);
  if (!std) return;
  renderStandardModal(std.moduleId, std.subModuleId, id);
  document.getElementById('modalOverlay').classList.add('open');
}

function openUploadModal(moduleId, subId) {
  const mod = MODULES.find(m => m.id === moduleId);
  if (!mod) return;
  const sub = mod.subModules.find(s => s.id === subId);
  if (!sub) return;
  const fieldNames = sub.fields.map(f => f.label).join('、');

  document.getElementById('modal').innerHTML = `
    <div class="modal-header"><h2>上传标准文档</h2></div>
    <div class="modal-body">
      <div class="form-group"><label>导入到</label><input type="text" value="${mod.name} / ${sub.name}" disabled></div>
      <div class="form-group upload-box">
        <label>选择标准文档 <span class="req">*</span></label>
        <input type="file" id="upload-file" accept=".doc,.docx,.xls,.xlsx,.pdf">
        <div class="upload-note">
          <div><strong>支持格式：</strong>Word（.doc/.docx）、Excel（.xls/.xlsx）、PDF（.pdf），单个文件建议不超过 20MB。</div>
          <div><strong>识别内容：</strong>功能名称、功能描述、标准化要素（${fieldNames || '按当前子模块字段识别'}）。</div>
          <div><strong>上传结果：</strong>系统会生成一条“已创建”标准，用户可继续编辑确认后提交审核。</div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="submitUpload('${moduleId}','${subId}')">上传</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('open');
}

function renderStandardModal(moduleId, subId, stdId) {
  const mod = MODULES.find(m => m.id === moduleId);
  const sub = mod.subModules.find(s => s.id === subId);
  const std = stdId ? STANDARDS.find(s => s.id === stdId) : null;
  const isEdit = !!std;
  
  const subOptions = mod.subModules.map(s => `<option value="${s.id}" ${s.id===subId?'selected':''}>${s.name}</option>`).join('');
  
  const fieldsHtml = sub ? sub.fields.map(f => {
    const currentVal = std ? (std.elements && std.elements[f.key] !== undefined ? std.elements[f.key] : '') : '';
    if (f.type === 'select') {
      const opts = (f.options || []).map(o => `<option value="${o}" ${currentVal === o ? 'selected' : ''}>${o}</option>`).join('');
      return `<div class="form-group"><label>${f.label}</label><select id="field-${f.key}"><option value="">请选择</option>${opts}</select></div>`;
    } else if (f.type === 'textarea') {
      return `<div class="form-group" style="grid-column:1/-1"><label>${f.label}</label><textarea id="field-${f.key}" rows="2" placeholder="请输入${f.label}">${currentVal || ''}</textarea></div>`;
    } else {
      return `<div class="form-group"><label>${f.label}${f.unit ? ' ('+f.unit+')' : ''}</label><input type="${f.type==='number'?'number':'text'}" id="field-${f.key}" placeholder="请输入${f.label}" value="${currentVal || ''}"></div>`;
    }
  }).join('') : '';

  document.getElementById('modal').innerHTML = `
    <div class="modal-header"><h2>${isEdit ? '编辑标准' : '新建标准'}</h2></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group"><label>功能名称 <span class="req">*</span></label><input type="text" id="std-name" placeholder="请输入功能名称" value="${std ? std.name : ''}"></div>
        <div class="form-group"><label>所属子模块 <span class="req">*</span></label><select id="std-sub" onchange="renderStandardModal('${moduleId}',this.value,'${stdId || ''}')">${subOptions}</select></div>
      </div>
      <div class="form-group"><label>功能描述 <span class="req">*</span></label><textarea id="std-desc" rows="3" placeholder="请输入标准功能描述">${std ? std.description : ''}</textarea></div>
      ${sub && sub.fields.length ? `<div style="border-top:1px solid var(--border);padding-top:16px;margin-top:8px"><h4 style="font-size:14px;font-weight:600;margin-bottom:12px">标准化要素</h4><div class="form-row" style="flex-wrap:wrap">${fieldsHtml}</div></div>` : ''}
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="submitStandard('${moduleId}','${stdId || ''}')">${isEdit ? '保存修改' : '创建标准'}</button>
    </div>
  `;
}

function submitStandard(moduleId, stdId) {
  const name = document.getElementById('std-name').value.trim();
  const desc = document.getElementById('std-desc').value.trim();
  const subSelect = document.getElementById('std-sub');
  const actualSubId = subSelect.value;
  
  if (!name) { showToast('请输入标准名称'); return; }
  if (!desc) { showToast('请输入功能描述'); return; }

  const mod = MODULES.find(m => m.id === moduleId);
  const sub = mod.subModules.find(s => s.id === actualSubId);
  
  const elements = {};
  if (sub) {
    sub.fields.forEach(f => {
      const el = document.getElementById('field-' + f.key);
      if (el && el.value) elements[f.key] = el.value;
    });
  }

  const prefixes = {
    'gpa-acq':'GPA-ACQ','gpa-analysis':'GPA-ANL',
    'cell-build':'CM-BLD','cell-use':'CM-USE',
    'pilot-define':'PP-DEF','pilot-digital':'PP-DIG','pilot-model':'PP-MDL',
    'encrypt-scope':'ENC-SCP','encrypt-algo':'ENC-ALG','encrypt-access':'ENC-ACC'
  };
  const prefix = prefixes[actualSubId] || 'STD';
  const now = new Date().toISOString().slice(0,10);
  const time = new Date().toTimeString().slice(0,5);

  if (stdId) {
    const std = STANDARDS.find(s => s.id === stdId);
    if (!std) return;
    std.name = name;
    std.moduleId = moduleId;
    std.subModuleId = actualSubId;
    std.description = desc;
    std.elements = elements;
    std.updatedAt = now;
    closeModal();
    showToast('标准已保存');
  } else {
    const newStd = {
      id: 'new-' + Date.now(),
      code: prefix + '-' + String(Math.floor(Math.random()*900)+100),
      name, moduleId, subModuleId: actualSubId,
      description: desc, status: 'draft',
      elements,
      statusHistory: [{ status:'draft', statusLabel: STATUS_MAP.draft.label, operator:'当前用户', time: now+' '+time, remark:'新建标准' }],
      reviewComments: [], createdAt: now, updatedAt: now
    };

    STANDARDS.unshift(newStd);
    closeModal();
    showToast('标准创建成功');
  }
  currentSubFilter = actualSubId;
  renderModulePage(moduleId);
}

function submitUpload(moduleId, subId) {
  const fileInput = document.getElementById('upload-file');
  const file = fileInput.files[0];
  if (!file) { showToast('请选择标准文档'); return; }

  const mod = MODULES.find(m => m.id === moduleId);
  const sub = mod.subModules.find(s => s.id === subId);
  const prefixes = {
    'gpa-acq':'GPA-ACQ','gpa-analysis':'GPA-ANL',
    'cell-build':'CM-BLD','cell-use':'CM-USE',
    'pilot-define':'PP-DEF','pilot-digital':'PP-DIG','pilot-model':'PP-MDL',
    'encrypt-scope':'ENC-SCP','encrypt-algo':'ENC-ALG','encrypt-access':'ENC-ACC'
  };
  const now = new Date().toISOString().slice(0,10);
  const time = new Date().toTimeString().slice(0,5);
  const fileName = file.name.replace(/\.[^.]+$/, '');
  const elements = {};
  sub.fields.forEach(f => { elements[f.key] = '待确认'; });

  STANDARDS.unshift({
    id: 'upload-' + Date.now(),
    code: (prefixes[subId] || 'STD') + '-' + String(Math.floor(Math.random()*900)+100),
    name: fileName || sub.name + '标准',
    moduleId,
    subModuleId: subId,
    description: '已从上传文档中识别生成，待补充确认功能描述。',
    status: 'draft',
    elements,
    statusHistory: [{ status:'draft', statusLabel:STATUS_MAP.draft.label, operator:'当前用户', time:now+' '+time, remark:'上传文档并识别生成标准' }],
    reviewComments: [],
    createdAt: now,
    updatedAt: now
  });
  currentSubFilter = subId;
  closeModal();
  renderModulePage(moduleId);
  showToast('上传成功，已生成待确认标准');
}

function advanceStandardStatus(id) {
  const std = STANDARDS.find(s => s.id === id);
  if (!std) return;
  const next = std.status === 'draft'
    ? { status:'reviewing', remark:'提交审核', toast:'已提交审核' }
    : std.status === 'reviewing'
      ? { status:'published', remark:'确认发布', toast:'已确认发布' }
      : null;
  if (!next) return;

  const now = new Date().toISOString().slice(0,10);
  const time = new Date().toTimeString().slice(0,5);
  std.status = next.status;
  std.updatedAt = now;
  std.statusHistory = std.statusHistory || [];
  std.statusHistory.push({
    status: next.status,
    statusLabel: STATUS_MAP[next.status].label,
    operator: '当前用户',
    time: now + ' ' + time,
    remark: next.remark
  });
  renderModulePage(currentModuleId || std.moduleId);
  showToast(next.toast);
}

function deleteStandard(id) {
  const idx = STANDARDS.findIndex(s => s.id === id);
  if (idx < 0) return;
  const std = STANDARDS[idx];
  const ok = confirm(`确定删除标准「${std.name}」吗？`);
  if (!ok) return;
  STANDARDS.splice(idx, 1);
  if (document.getElementById('drawer').classList.contains('open')) closeDrawer();
  renderModulePage(currentModuleId || std.moduleId);
  showToast('已删除');
}

function closeModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('modalOverlay').classList.remove('open');
}

// ===== TOAST =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== INIT =====
if (new URLSearchParams(window.location.search).get('embedded') === '1') {
  document.body.classList.add('embedded');
}
renderMenu();
const initialModule = new URLSearchParams(window.location.search).get('module') || location.hash.replace(/^#/, '') || 'gpa';
navigate('module', initialModule);
</script>
