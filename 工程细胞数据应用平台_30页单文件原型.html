<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200, initial-scale=1" />
  <title>工程细胞数据应用平台 - 30页原型</title>
  <style>
    :root {
      --sidebar: linear-gradient(180deg, #DCEEFF 0%, #CFE5FF 42%, #EDF6FF 100%);
      --sidebar-text: #595959;
      --primary: #1677FF;
      --primary-hover: #4096FF;
      --primary-active: #0958D9;
      --page-bg: #F5F7FA;
      --card: #ffffff;
      --border: #E8E8E8;
      --text: #262626;
      --muted: #595959;
      --success: #52C41A;
      --warning: #FAAD14;
      --danger: #FF4D4F;
      --info: #1677FF;
      --shadow: 0 2px 8px 0 rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 1200px; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: var(--page-bg);
      font-size: 14px;
      line-height: 1.5;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    #sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: 220px;
      overflow-y: auto;
      background: var(--sidebar);
      color: var(--sidebar-text);
      z-index: 10;
    }
    .logo {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      font-size: 18px;
      font-weight: 700;
      border-bottom: 1px solid rgba(22, 119, 255, 0.12);
    }
    #sidebar-nav { padding: 12px 10px 24px; }
    .nav-group { margin-bottom: 4px; }
    .nav-head, .nav-leaf {
      width: 100%;
      min-height: 36px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      text-align: left;
    }
    .nav-head:hover, .nav-leaf:hover { background: #fff; color: var(--primary); }
    .nav-leaf.is-active { background: #fff; color: var(--primary); box-shadow: var(--shadow); }
    .nav-children {
      max-height: 0;
      overflow: hidden;
      transition: max-height .25s ease;
      padding-left: 10px;
    }
    .nav-group.is-open > .nav-children { max-height: 1600px; }
    .arrow { transition: transform .2s ease; font-size: 12px; }
    .nav-group.is-open > .nav-head .arrow { transform: rotate(90deg); }
    .nav-leaf { font-size: 12px; color: #666; }
    .nav-level-3 .nav-leaf { padding-left: 16px; }
    .nav-level-4 .nav-leaf { padding-left: 22px; }

    #main-content {
      margin-left: 220px;
      height: 100vh;
      overflow-y: auto;
      padding: 24px;
      background: var(--page-bg);
    }
    #breadcrumb {
      min-height: 24px;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 16px;
    }
    #breadcrumb span { color: var(--muted); cursor: pointer; }
    #breadcrumb b { color: var(--text); }
    .page { display: none; }
    .page.is-active { display: block; }
    .page-title {
      margin: 0 0 16px;
      font-size: 18px;
      font-weight: 700;
    }
    .grid { display: grid; gap: 16px; }
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 16px;
    }
    .card-title {
      margin: -2px 0 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title::before {
      content: "";
      width: 4px;
      height: 18px;
      border-radius: 999px;
      background: var(--primary);
    }
    .form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 14px; }
    .form-row.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    label.field { display: grid; gap: 6px; color: var(--muted); font-size: 12px; }
    input, select, textarea {
      min-height: 32px;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 10px;
      background: #fff;
      color: var(--text);
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22, 119, 255, .2); }
    .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .btn {
      min-height: 32px;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 14px;
      background: #fff;
      color: var(--text);
      transition: background .15s ease, border-color .15s ease, color .15s ease;
    }
    .btn:hover { border-color: #4096FF; background: #fff; color: var(--primary); }
    .btn.primary { border-color: var(--primary); background: var(--primary); color: #fff; }
    .btn.primary:hover { border-color: var(--primary-hover); background: var(--primary-hover); color: #fff; }
    .btn.link { border-color: transparent; background: transparent; color: var(--muted); }
    .btn.danger { color: var(--danger); border-color: #fecaca; background: #fff5f5; }
    .error-text { display: none; color: var(--danger); font-size: 12px; margin-top: -6px; }
    .error-text.show { display: block; }
    .loading { display: inline-flex; align-items: center; gap: 10px; color: var(--muted); }
    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid #dbeafe;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty {
      min-height: 110px;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: #f8fafc;
    }
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
    th { background: #F5F5F5; font-weight: 500; user-select: none; color: var(--text); }
    th.sortable { cursor: pointer; }
    tbody tr:nth-child(even) { background: #f8fafc; }
    tbody tr:hover { background: #eff6ff; }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 0 9px;
      font-size: 12px;
      font-weight: 700;
    }
    .success { color: #047857; background: #d1fae5; }
    .warning { color: #b45309; background: #fef3c7; }
    .danger { color: #b91c1c; background: #fee2e2; }
    .info { color: #1d4ed8; background: #dbeafe; }
    .muted { color: #475569; background: #e2e8f0; }
    .progress { width: 130px; height: 8px; background: #e2e8f0; border-radius: 999px; overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 8px; }
    .progress i { display: block; height: 100%; background: var(--primary); border-radius: inherit; transition: width .3s ease; }
    .pagination { display: flex; align-items: center; gap: 6px; padding: 12px 0 0; }
    .page-btn { min-width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
    .page-btn.is-current { background: var(--primary); color: #fff; border-color: var(--primary); }
    .page-jump { width: 64px; min-height: 32px; }

    .tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
    .tab {
      border: 0;
      background: transparent;
      padding: 10px 14px;
      color: var(--muted);
      border-bottom: 2px solid transparent;
    }
    .tab.is-active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 700; }
    .tab-panel { display: none; }
    .tab-panel.is-active { display: block; }
    .accordion-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height .25s ease;
    }
    .accordion.is-open .accordion-body { max-height: 380px; }
    .accordion-toggle { width: 100%; justify-content: space-between; display: flex; }

    .metric-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      background: #f8fafc;
    }
    .metric-card strong { display: block; font-size: 22px; color: var(--primary); }
    .metric-card span { color: var(--muted); font-size: 12px; }
    .split { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; }
    .network-card svg, .chart-card svg { width: 100%; min-height: 360px; background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; }
    .node { cursor: pointer; transition: opacity .2s ease, stroke .2s ease; }
    .node:hover, .node.is-selected { stroke: var(--primary); stroke-width: 4; }
    .tooltip {
      position: fixed;
      display: none;
      pointer-events: none;
      z-index: 50;
      padding: 8px 10px;
      border-radius: 6px;
      background: #0f172a;
      color: #fff;
      font-size: 12px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .2);
    }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: 12px; margin-top: 10px; }
    .legend span::before { content: ""; display: inline-block; width: 18px; height: 3px; margin-right: 6px; vertical-align: middle; background: currentColor; }
    .legend .green { color: var(--success); }
    .legend .red { color: var(--danger); }
    .legend .orange { color: var(--warning); }
    .formula { padding: 14px; border-radius: 8px; background: #f1f5f9; font-family: Consolas, monospace; color: #334155; }
    .heat-grid { display: grid; grid-template-columns: 180px repeat(4, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); }
    .heat-grid div { background: #fff; padding: 10px; }
    .heat-low { background: #dbeafe !important; }
    .heat-mid { background: #93c5fd !important; }
    .heat-high { background: #3b82f6 !important; color: #fff; }
    .heat-max { background: #1d4ed8 !important; color: #fff; }
    .dbtl-flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .dbtl-step { padding: 16px; border-radius: 8px; text-align: center; border: 1px solid var(--border); background: #f8fafc; }
    .dbtl-step.done { background: #d1fae5; color: #047857; }
    .dbtl-step.active { background: #dbeafe; color: #1d4ed8; animation: pulse 1.4s ease infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(59, 130, 246, .12); } }
    .timeline { border-left: 2px solid #bfdbfe; padding-left: 18px; display: grid; gap: 12px; }
    .timeline-item { position: relative; padding: 12px; background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; }
    .timeline-item::before { content: ""; position: absolute; left: -27px; top: 16px; width: 14px; height: 14px; border-radius: 50%; background: var(--primary); }
    .bar-chart { display: flex; align-items: end; gap: 16px; height: 180px; padding: 18px; border: 1px solid var(--border); border-radius: 8px; background: #f8fafc; }
    .bar { width: 48px; background: var(--primary); border-radius: 6px 6px 0 0; color: #fff; display: flex; align-items: end; justify-content: center; padding-bottom: 6px; font-size: 12px; }
    .service-card { border-left: 4px solid var(--primary); }

    #modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(0, 0, 0, .5);
      z-index: 100;
    }
    #modal.is-open { display: grid; }
    .modal-dialog {
      width: min(900px, calc(100vw - 80px));
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 24px 70px rgba(15, 23, 42, .32);
      animation: modalIn .18s ease;
    }
    @keyframes modalIn { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: scale(1); } }
    .modal-head, .modal-foot { padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .modal-foot { border-top: 1px solid var(--border); border-bottom: 0; justify-content: flex-end; gap: 10px; }
    .modal-body { padding: 18px; max-height: 68vh; overflow: auto; }
    .modal-close { border: 0; background: transparent; font-size: 20px; color: var(--muted); }
    #toast {
      position: fixed;
      top: 18px;
      right: 18px;
      display: none;
      z-index: 120;
      padding: 12px 14px;
      border-radius: 8px;
      background: #0f766e;
      color: #fff;
      box-shadow: 0 10px 28px rgba(15, 23, 42, .2);
    }
    #toast.show { display: block; }
  </style>
</head>

    function renderTable(id, rows, pageSize = 5) {
      const page = state.tablePage[id] || 1;

      let data = [...rows];
      if (sort) data.sort((a, b) => String(a[sort.key]).localeCompare(String(b[sort.key]), "zh-Hans", { numeric: true }) * sort.dir);
      const count = Math.max(1, Math.ceil(data.length / pageSize));
      const sliced = data.slice((page - 1) * pageSize, page * pageSize);
      return `<div class="table-wrap"><table data-table="${id}"><thead><tr>${keys.map(k => `<th class="sortable" data-sort-key="${escapeHtml(k)}">${escapeHtml(k)}${sort?.key === k ? (sort.dir > 0 ? " ↑" : " ↓") : ""}</th>`).join("")}</tr></thead><tbody>${sliced.map(row => `<tr>${keys.map(k => `<td>${renderCell(k, row[k])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${renderPagination(id, count, page)}`;

    }
    function chart(type) {
      if (type === "heat") return `<div class="heat-grid">${["通路","转录水平","蛋白水平","代谢活性","综合","糖酵解","高","高","高","高","TCA循环","中","中","中","中","氧化磷酸化","低","低","低","低","番茄红素合成","极高","高","中","高"].map((x,i)=>`<div class="${i>4 ? (x==="极高"?"heat-max":x==="高"?"heat-high":x==="中"?"heat-mid":x==="低"?"heat-low":"") : ""}">${x}</div>`).join("")}</div>`;
      if (["line","loss","roc"].includes(type)) return `<div class="chart-card"><svg viewBox="0 0 760 320"><polyline points="40,270 140,230 240,180 340,120 460,82 580,56 700,38" fill="none" stroke="#3b82f6" stroke-width="4"/><line x1="40" y1="280" x2="720" y2="280" stroke="#cbd5e1"/><line x1="40" y1="20" x2="40" y2="280" stroke="#cbd5e1"/><text x="45" y="30" fill="#64748b">趋势图</text></svg></div>`;
      if (["bars","params","suggest"].includes(type)) return `<div class="bar-chart">${[70,95,62,82,54,76].map(v=>`<div class="bar" style="height:${v}%">${v}</div>`).join("")}</div>`;
      if (["networkHidden","kg","panorama","flux","pathway"].includes(type)) return svgNetwork(type === "pathway" ? "pathway" : "gene");
      return `<div class="grid four"><div class="metric-card"><strong>128</strong><span>节点数</span></div><div class="metric-card"><strong>156</strong><span>反应数</span></div><div class="metric-card"><strong>89</strong><span>代谢物数</span></div><div class="metric-card"><strong>0.92</strong><span>模型评分</span></div></div>`;
    }

    function renderA1() {
      return `<h1 class="page-title">GPA数据检索</h1><section class="card"><h2 class="card-title">检索条件</h2><div class="form-row"><label class="field"><span>基因型关键字</span><input id="a1-gene" placeholder="如：苯砜" /></label><label class="field"><span>表型关键字</span><input id="a1-pheno" placeholder="如：耐受" /></label></div><div class="form-row three"><label class="field"><span>底盘细胞</span><select><option>酵母</option><option>大肠杆菌</option><option>枯草芽孢杆菌</option></select></label><label class="field"><span>数据来源</span><select><option>全部</option><option>公开数据</option><option>实验累积</option></select></label><label class="field"><span>数据范围</span><select><option>全部</option><option>近1年</option><option>近3年</option><option>近5年</option></select></label></div><p id="a1-error" class="error-text">请至少输入一个检索关键字</p><div class="accordion" id="a1-advanced"><button class="btn accordion-toggle" type="button" data-accordion="#a1-advanced">高级检索 <span>展开/收起</span></button><div class="accordion-body"><div class="form-row"><label class="field"><span>关联强度</span><input type="range" min="0" max="1" step="0.01" value="0.6" /></label><label class="field"><span>时间范围</span><input type="date" value="2026-07-20" /></label></div></div></div><div class="actions"><button class="btn primary" type="button" data-a1-search>检索</button><button class="btn" type="button" data-accordion="#a1-advanced">高级检索</button><button class="btn link" type="button" data-a1-reset>重置</button></div></section><section class="card" id="a1-result"><h2 class="card-title">检索结果列表</h2>${state.running["page-A1"] ? `<div class="loading"><span class="spinner"></span>加载中...</div>` : state.resultVisible["page-A1"] ? `<div class="actions" style="justify-content:space-between;margin-top:0"><span>共检索到 128 条记录</span><select><option>排序: 相关度降序</option></select></div>${renderTable("a1", gpaRows, 4)}<div class="actions"><button class="btn primary" data-modal-title="导出结果" data-modal-body="选择导出格式：CSV / Excel">导出结果</button><button class="btn primary" data-jump="page-A2">查看关联网络</button><button class="btn primary" data-jump="page-A3">发起预测分析</button></div>` : `<div class="empty">请输入关键字进行检索</div>`}</section><section class="card"><h2 class="card-title">快速统计面板</h2><div class="grid three"><div class="metric-card"><strong>45</strong><span>涉及基因数</span></div><div class="metric-card"><strong>6</strong><span>扰动类型数</span></div><div class="metric-card"><svg viewBox="0 0 120 80" width="120" height="80"><circle cx="40" cy="40" r="30" fill="#dbeafe"/><path d="M40 40 L40 10 A30 30 0 0 1 68 50 Z" fill="#3b82f6"/><path d="M40 40 L68 50 A30 30 0 0 1 22 64 Z" fill="#10b981"/></svg><span>数据来源分布</span></div></div></section>`;
    }
    function renderA2() {
      const selected = state.selectedNode;
      return `<h1 class="page-title">GPA关联关系展示</h1><section class="card"><h2 class="card-title">工具栏</h2><div class="form-row three"><label class="field"><span>布局切换</span><select data-layout><option>力导向</option><option>层级</option><option>环形</option></select></label><label class="field"><span>筛选节点</span><select><option>全部</option><option>关联强度&gt;0.8</option><option>关联强度&gt;0.6</option></select></label><label class="field"><span>高亮</span><select><option>全部</option><option>激活路径</option><option>关闭路径</option></select></label></div><div class="actions"><button class="btn">放大</button><button class="btn">缩小</button><button class="btn">重置视图</button><button class="btn primary" data-modal-title="导出图片" data-modal-body="网络图片已加入导出队列。">导出图片</button><button class="btn" data-jump="page-A1">返回检索</button></div></section><div class="split"><section class="card"><h2 class="card-title">关联网络图区域</h2>${svgNetwork("gene")}</section><aside class="card"><h2 class="card-title">节点详情</h2>${selected ? `<p><b>基因名称：</b>${selected}</p><p><b>关联表型：</b>苯砜耐受（关联强度: 0.92）</p><p><b>扰动方式：</b>过表达</p><p><b>上游基因：</b>Gene_B, Gene_F</p><p><b>下游基因：</b>Gene_C, Gene_D</p><p><b>调控关系：</b>激活路径</p><div class="actions"><button class="btn primary" data-modal-title="基因详情" data-modal-body="${selected}完整信息、调控关系与实验数据摘要。">查看详情</button><button class="btn" data-jump="page-A4">发起DBTL迭代</button></div>` : "点击网络图中的节点查看详情"}</aside></div>`;
    }
    function renderA3() {
      const rows = ["Gene_A(过表达)+Gene_B(敲除)+Gene_C(点突变)|0.95|耐受浓度150mM|推荐","Gene_A(过表达)+Gene_D(过表达)+Gene_C(点突变)|0.91|耐受浓度138mM|-","Gene_D(过表达)+Gene_B(敲除)+Gene_C(点突变)|0.88|耐受浓度125mM|-","Gene_A(过表达)+Gene_B(敲除)+Gene_D(过表达)|0.85|耐受浓度118mM|-","Gene_B(敲除)+Gene_C(点突变)+Gene_F(过表达)|0.82|耐受浓度108mM|-"].map((r,i)=>{const a=r.split("|");return {"排名":i+1,"基因型组合":a[0],"预测评分":a[1],"预期表型值":a[2],"状态":a[3],"操作":"查看方案详情"}});
      return `<h1 class="page-title">最优基因型组合预测</h1>${formCard("预测任务配置", `<div class="actions"><label><input type="radio" name="goal"> 最大化耐受性</label><label><input type="radio" name="goal"> 产量优先</label><label><input type="radio" name="goal" checked> 综合优化</label></div><p>候选基因集：<label><input data-candidate checked type="checkbox"> Gene_A(过表达)</label> <label><input data-candidate checked type="checkbox"> Gene_B(敲除)</label> <label><input data-candidate checked type="checkbox"> Gene_C(点突变)</label> <label><input data-candidate checked type="checkbox"> Gene_D(过表达)</label> <label><input data-candidate type="checkbox"> Gene_F(过表达)</label></p><p id="candidate-count">已选: 4个基因</p>`)}${tabCard("a3", ["排行榜视图", "雷达图视图", "矩阵视图"], t => t === "排行榜视图" ? `${renderTable("a3rank", rows, 5)}<div class="actions"><button class="btn primary" data-modal-title="方案详情" data-modal-body="各基因贡献度柱状图、风险和验证建议。">查看方案详情</button><button class="btn" data-jump="page-A4">发起DBTL验证</button></div>` : chart(t === "雷达图视图" ? "line" : "params"))}`;
    }
    function renderA4() {
      return `<h1 class="page-title">DBTL迭代管理</h1><section class="card"><h2 class="card-title">迭代周期总览</h2><p>当前迭代: 第 3 轮 | 目标表型: 苯砜耐受 | 底盘细胞: 酵母</p><div class="dbtl-flow"><div class="dbtl-step done"><b>D 设计</b><br>已完成</div><div class="dbtl-step active"><b>B 构建</b><br>进行中</div><div class="dbtl-step"><b>T 测试</b><br>待执行</div><div class="dbtl-step"><b>L 学习</b><br>待执行</div></div></section><section class="card"><h2 class="card-title">当前阶段: B(构建)</h2><p>基因型组合：Gene_A(过表达)+Gene_B(敲除)+Gene_C(点突变)</p><p>构建进度 <span class="progress"><i style="width:60%"></i></span> 60%</p><ul><li>Gene_A过表达载体构建（已完成）</li><li>Gene_B敲除载体构建（已完成）</li><li>Gene_C点突变载体构建（进行中）</li><li>组合转化与验证（待执行）</li></ul><div class="actions"><button class="btn primary" data-modal-title="录入构建结果" data-modal-body="构建状态选择：成功/失败；备注输入。">录入构建结果</button><button class="btn" data-modal-title="确认" data-modal-body="确认后当前阶段变为已完成，下一阶段变为进行中。">标记阶段完成</button></div></section>${tabCard("a4", ["D.设计", "B.构建", "T.测试", "L.学习"], () => formCard("阶段操作面板"))}`;
    }
    function renderB1() {
      const matrixRows = [
        {"代谢物/反应":"底物A","反应1":-1,"反应2":0,"反应3":0,"反应4":0,"反应5":0},
        {"代谢物/反应":"产物B","反应1":1,"反应2":-1,"反应3":0,"反应4":0,"反应5":0},
        {"代谢物/反应":"产物C","反应1":0,"反应2":1,"反应3":-1,"反应4":0,"反应5":1},
        {"代谢物/反应":"目标产物E","反应1":0,"反应2":0,"反应3":0,"反应4":1,"反应5":-1},
        {"代谢物/反应":"副产物F","反应1":0,"反应2":0,"反应3":1,"反应4":0,"反应5":0}
      ];
      return `<h1 class="page-title">代谢通路网构建</h1><section class="card"><h2 class="card-title">数据库选择</h2><div class="actions"><label><input type="checkbox" checked> Reactome</label><label><input type="checkbox" checked> KEGG</label><label><input type="checkbox" checked> Rhea-db</label><label><input type="checkbox"> BioCyc</label><button class="btn">添加</button></div><div class="form-row three"><label class="field"><span>底盘细胞</span><select><option>酵母</option><option>大肠杆菌</option></select></label><label class="field"><span>代谢网络范围</span><select><option>全细胞</option><option>中心代谢</option></select></label><label class="field"><span>目标产物</span><input value="番茄红素"></label></div><div class="actions"><button class="btn primary" type="button" data-run>构建代谢通路网</button><button class="btn" data-modal-title="加载已有模型" data-modal-body="请选择已有GEMS或FBA模型。">加载已有模型</button></div></section><section class="card"><h2 class="card-title">代谢通路网络图</h2>${state.running["page-B1"] ? `<div class="loading"><span class="spinner"></span>加载中...</div>` : svgNetwork("pathway")}<p>节点数: 128 | 反应数: 156 | 代谢物数: 89</p><div class="actions"><button class="btn primary" data-accordion="#b1-matrix">矩阵化预览</button><button class="btn">导出S/B文件</button></div></section><section class="card accordion" id="b1-matrix"><h2 class="card-title">化学计量矩阵(S矩阵)预览</h2><div class="accordion-body"><div class="formula">Sv = 0  （代谢通量平衡方程）</div>${renderTable("b1matrix", matrixRows, 5)}<div class="actions"><button class="btn primary" data-jump="page-B3">进入优化求解</button><button class="btn">编辑矩阵</button><button class="btn">导出模型</button></div></div></section>`;
    }
    function renderE1() {
      const services = [
        ["基因型-表型分析","GPA/GWAS分析预测","page-A1"],["组学数据分析","GEMS构建/代谢平衡","page-B1"],["发酵过程数据分析","代谢模型/ANN优化","page-C1"],["全流程数据分析","知识图谱/参数预测","page-D1"],["AI辅助分析平台","降维/机器学习/深度学习","page-A7"]
      ];
      return `<h1 class="page-title">主题应用交互首页</h1><section class="card"><h2 class="card-title">搜索栏</h2><input style="width:100%;height:48px" placeholder="搜索细胞、菌株、基因、产物..." data-search-box /></section><section class="card"><h2 class="card-title">分析服务</h2><div class="grid five">${services.map(([a,b,r])=>`<article class="metric-card service-card"><strong style="font-size:16px">${a}</strong><span>${b}</span><div class="actions"><button class="btn primary" data-jump="${r}">进入</button></div></article>`).join("")}</div></section><section class="card"><h2 class="card-title">快速入口</h2><div class="grid three">${[["细胞基本信息查询","page-E2"],["培养条件查询","page-E3"],["检测数据查询","page-E4"],["工程化应用案例","page-E5"],["上传数据","page-A5"],["我的分析任务","page-E1"]].map(([a,r])=>`<button class="btn" data-jump="${r}">${a}</button>`).join("")}</div></section><section class="card"><h2 class="card-title">我的分析任务</h2>${renderTable("e1task", [{"任务名称":"酵母苯砜耐受优化","类型":"GPA分析","状态":"计算中","创建时间":"07-20 10:30","操作":"查看"},{"任务名称":"番茄红素产量预测","类型":"发酵优化","状态":"已完成","创建时间":"07-18 14:20","操作":"查看"},{"任务名称":"大肠杆菌组学分析","类型":"组学分析","状态":"已完成","创建时间":"07-15 09:10","操作":"查看"},{"任务名称":"专利竞争分析","类型":"全流程分析","状态":"待执行","创建时间":"07-12 16:45","操作":"查看"}], 4)}</section>`;
    }
    function renderGeneric(pageId, config) {
      return `<h1 class="page-title">${config.title}</h1><section class="card"><h2 class="card-title">页面说明</h2><p>${config.subtitle}</p></section>${formCard(config.tabs?.[0] || "配置区")}<section class="card chart-card"><h2 class="card-title">图表与网络展示</h2>${chart(config.chart)}</section>${tabCard(pageId, config.tabs || ["结果"], tab => renderTable(pageId + tab, commonRows, 4))}<div class="actions">${config.jump ? `<button class="btn primary" data-jump="${config.jump[1]}">${config.jump[0]}</button>` : ""}<button class="btn" data-modal-title="${config.title}" data-modal-body="展示详情、上传区域、导出格式选择或确认操作。">查看详情</button><button class="btn">导出结果</button></div>`;
    }
    function renderAux(pageId, title) {
      return `<h1 class="page-title">${title}</h1><section class="card"><h2 class="card-title">${title}</h2><div class="grid four"><div class="metric-card"><strong>1,256</strong><span>资源总数</span></div><div class="metric-card"><strong>98.5%</strong><span>数据完整率</span></div><div class="metric-card"><strong>32</strong><span>今日新增</span></div><div class="metric-card"><strong>12</strong><span>待处理</span></div></div></section><section class="card">${renderTable(pageId+"aux", commonRows, 4)}</section>`;
    }

    function renderAllPages() {
      document.getElementById("page-A1").innerHTML = renderA1();
      document.getElementById("page-A2").innerHTML = renderA2();
      document.getElementById("page-A3").innerHTML = renderA3();
      document.getElementById("page-A4").innerHTML = renderA4();
      document.getElementById("page-B1").innerHTML = renderB1();
      document.getElementById("page-E1").innerHTML = renderE1();
      Object.entries(genericPages).forEach(([id, config]) => document.getElementById(id).innerHTML = renderGeneric(id, config));
      document.getElementById("page-dashboard").innerHTML = renderAux("dashboard", "数据看板");
      document.getElementById("page-catalog").innerHTML = renderAux("catalog", "数据资源目录");
      document.getElementById("page-physical").innerHTML = renderAux("physical", "发酵过程数据检测物理传感器工具");
      document.getElementById("page-biological").innerHTML = renderAux("biological", "发酵过程数据检测生物传感器工具");
    }

    document.addEventListener("click", event => {
      const head = event.target.closest(".nav-head");
      if (head) { head.parentElement.classList.toggle("is-open"); return; }
      const route = event.target.closest("[data-route], [data-jump]");
      if (route) { navigateTo(route.dataset.route || route.dataset.jump); return; }
      const modalBtn = event.target.closest("[data-modal-title]");
      if (modalBtn) { openModal(modalBtn.dataset.modalTitle, modalBtn.dataset.modalBody || "操作内容"); return; }
      if (event.target.closest("[data-close-modal]") || event.target.id === "modal") { closeModal(); return; }
      const accordion = event.target.closest("[data-accordion]");
      if (accordion) { document.querySelector(accordion.dataset.accordion)?.classList.toggle("is-open"); return; }
      const tab = event.target.closest("[data-tab-scope]");
      if (tab) { state.tab[tab.dataset.tabScope] = tab.dataset.tab; renderAllPages(); return; }
      const th = event.target.closest("th.sortable");
      if (th) {
        const id = th.closest("table").dataset.table;
        const key = th.dataset.sortKey;
        state.sort[id] = state.sort[id]?.key === key ? { key, dir: -state.sort[id].dir } : { key, dir: 1 };
        renderAllPages();
        return;
      }
      const pager = event.target.closest("[data-pagination] .page-btn");
      if (pager) {
        const wrap = pager.closest("[data-pagination]");
        const id = wrap.dataset.pagination;
        const max = Number(wrap.querySelector(".page-jump")?.max || 1);
        const current = state.tablePage[id] || 1;
        if (pager.dataset.page) state.tablePage[id] = Number(pager.dataset.page);
        if (pager.dataset.pageOp === "prev") state.tablePage[id] = Math.max(1, current - 1);
        if (pager.dataset.pageOp === "next") state.tablePage[id] = Math.min(max, current + 1);
        if (pager.dataset.pageOp === "jump") state.tablePage[id] = Math.max(1, Math.min(max, Number(wrap.querySelector(".page-jump").value || current)));
        renderAllPages();
        return;
      }
      if (event.target.closest("[data-run]")) {
        const page = state.activePage;
        state.running[page] = true;
        renderAllPages();
        setTimeout(() => { state.running[page] = false; state.resultVisible[page] = true; renderAllPages(); showToast("处理完成"); }, page === "page-A3" ? 3000 : 2000);
        return;
      }
      if (event.target.closest("[data-a1-search]")) {
        const gene = document.getElementById("a1-gene").value.trim();
        const pheno = document.getElementById("a1-pheno").value.trim();
        document.getElementById("a1-error").classList.toggle("show", !gene && !pheno);
        if (!gene && !pheno) return;
        state.running["page-A1"] = true;
        renderAllPages();
        setTimeout(() => { state.running["page-A1"] = false; state.resultVisible["page-A1"] = true; renderAllPages(); }, 2000);
        return;
      }
      if (event.target.closest("[data-a1-reset]")) {
        state.resultVisible["page-A1"] = false;
        renderAllPages();
        return;
      }
      const node = event.target.closest(".node");
      if (node) { state.selectedNode = node.dataset.node; showToast(`已选中 ${node.dataset.node}`); renderAllPages(); return; }
    });

    document.addEventListener("change", event => {
      if (event.target.matches("[data-candidate]")) {
        const count = document.querySelectorAll("[data-candidate]:checked").length;
        const el = document.getElementById("candidate-count");
        if (el) el.textContent = `已选: ${count}个基因`;
      }
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Enter" && event.target.matches("[data-search-box]")) {
        openModal("搜索结果", "<div class='table-wrap'><table><tbody><tr><td>高产L-赖氨酸工程菌</td><td>细胞档案</td></tr><tr><td>番茄红素产量预测</td><td>分析任务</td></tr><tr><td>Gene_A</td><td>GPA关联基因</td></tr></tbody></table></div>");
      }
      if (event.key === "Escape") closeModal();
    });
    document.addEventListener("mousemove", event => {
      const node = event.target.closest(".node");
      const tooltip = document.getElementById("tooltip");
      if (!node) { tooltip.style.display = "none"; return; }
      tooltip.textContent = `${node.dataset.node} | 关联强度 ${node.dataset.strength || "0.86"} | 调控方向 激活`;
      tooltip.style.display = "block";
      tooltip.style.left = `${event.clientX + 12}px`;
      tooltip.style.top = `${event.clientY + 12}px`;
    });

    document.getElementById("sidebar-nav").innerHTML = renderMenu(menu);
    renderAllPages();
    navigateTo("page-A1");
    window.navigateTo = navigateTo;
  </script>
</body>
</html>
